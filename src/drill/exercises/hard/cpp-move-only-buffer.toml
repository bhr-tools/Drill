title = "A move-only buffer"
kind = "code"
tags = ["cpp", "move-semantics", "raii", "rule-of-five"]
target = 900
statement = """
Buffer owns a heap array of ints:
- explicit Buffer(n): n zeros; size(), data() and operator[] (const and non-const);
- not copyable, but movable, and its moves are noexcept (so std::vector moves
  elements when it grows); a moved-from Buffer is empty: size 0, data nullptr;
- clone(): an explicit deep copy;
- a swap(a, b) found by argument-dependent lookup;
- no leaks: prefer owning the array with a smart pointer.
"""
hint = "std::unique_ptr<int[]> + std::make_unique<int[]>(n) (zero-filled); = delete the copies; std::exchange(other.size_, 0) in the moves; a friend swap."

[starter]
cpp = '''
#include <bits/stdc++.h>

class Buffer {
public:
    explicit Buffer(std::size_t n) {}
};
'''

[checks]
cpp = '''
CHECK(!std::is_copy_constructible_v<Buffer>);
CHECK(!std::is_copy_assignable_v<Buffer>);
CHECK(std::is_nothrow_move_constructible_v<Buffer>);
CHECK(std::is_nothrow_move_assignable_v<Buffer>);
CHECK(!std::is_convertible_v<std::size_t, Buffer>);
Buffer a(4);
CHECK_EQ(a.size(), std::size_t{4});
CHECK_EQ(a[3], 0);
a[1] = 7;
const Buffer& constant = a;
CHECK_EQ(constant[1], 7);
const int* storage = a.data();
Buffer b = std::move(a);
CHECK(b.data() == storage);
CHECK_EQ(b[1], 7);
CHECK_EQ(a.size(), std::size_t{0});
CHECK(a.data() == nullptr);
Buffer c = b.clone();
CHECK(c.data() != b.data());
c[1] = 9;
CHECK_EQ(b[1], 7);
Buffer d(2);
d = std::move(c);
CHECK_EQ(d.size(), std::size_t{4});
CHECK_EQ(d[1], 9);
CHECK(c.data() == nullptr);
std::vector<Buffer> many;
for (int i = 0; i < 1000; ++i) many.emplace_back(16);
CHECK_EQ(many.back().size(), std::size_t{16});
Buffer e(1), f(2);
swap(e, f);
CHECK_EQ(e.size(), std::size_t{2});
CHECK_EQ(f.size(), std::size_t{1});
'''

[solutions]
cpp = '''
#include <bits/stdc++.h>

class Buffer {
public:
    explicit Buffer(std::size_t n) : size_(n), data_(std::make_unique<int[]>(n)) {}  // zero-filled

    Buffer(const Buffer&) = delete;
    Buffer& operator=(const Buffer&) = delete;

    Buffer(Buffer&& other) noexcept
        : size_(std::exchange(other.size_, 0)), data_(std::move(other.data_)) {}

    Buffer& operator=(Buffer&& other) noexcept {
        size_ = std::exchange(other.size_, 0);
        data_ = std::move(other.data_);
        return *this;
    }

    Buffer clone() const {
        Buffer copy(size_);
        std::copy_n(data_.get(), size_, copy.data_.get());
        return copy;
    }

    std::size_t size() const { return size_; }
    int* data() { return data_.get(); }
    const int* data() const { return data_.get(); }
    int& operator[](std::size_t i) { return data_[i]; }
    const int& operator[](std::size_t i) const { return data_[i]; }

    friend void swap(Buffer& a, Buffer& b) noexcept {
        std::swap(a.size_, b.size_);
        std::swap(a.data_, b.data_);
    }

private:
    std::size_t size_ = 0;
    std::unique_ptr<int[]> data_;
};
'''
