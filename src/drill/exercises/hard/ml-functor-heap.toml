title = "A priority queue functor"
kind = "code"
tags = ["ocaml", "functor", "heap", "modules", "persistence"]
target = 900
statement = """
Write the functor Make (Ord : ORDERED) returning a persistent (immutable) min-heap,
a leftist heap or a pairing heap:

module type ORDERED = sig type t val compare : t -> t -> int end

module Make (Ord : ORDERED) : sig
  type elt = Ord.t
  type t
  val empty : t
  val is_empty : t -> bool
  val push : elt -> t -> t
  val pop : t -> (elt * t) option      (* the smallest element and the rest *)
  val of_list : elt list -> t
  val to_sorted_list : t -> elt list
end

push and pop are O(log n). The heap is persistent: pushing onto a heap leaves
the old one usable.
"""
hint = "Leftist heap: type t = E | T of int * elt * t * t (rank first); everything is merge."
explanation = """
A functor makes the heap generic over its ordering with no runtime cost and no
polymorphic compare: Make (Int) and Make (struct type t = int let compare a b =
compare b a end) are two different modules, with two incompatible types t, so a
max-heap can never be mixed up with a min-heap.

A leftist heap keeps, at every node, the rank (length of the right spine) of the
left child at least that of the right one, so the right spine has O(log n)
nodes. merge walks only the right spines and swaps children to restore the
invariant: push is merge with a singleton, pop merges the two children of the
root. As nothing is mutated, every old version stays valid: persistence for free.
"""

