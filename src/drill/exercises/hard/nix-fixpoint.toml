title = "Fixed points and extensions, from scratch"
kind = "code"
file = "fix.nix"
tags = ["nix", "fixpoint", "laziness", "overlays"]
target = 720
statement = """
nixpkgs, overlays and the module system all rest on a few lines of lib/fixed-points.nix.
Write them yourself, without lib, in fix.nix (an attribute set of functions):
- fix f: the fixed point of f, the attribute set x such that x = f x
  (fix (self: { a = 1; b = self.a + 1; }) is { a = 1; b = 2; }).
- extends overlay f: a new function whose fixed point is f's, with overlay
  (final: prev: { … }) applied on top: prev is f's result, final the end result.
- composeExtensions g h: one overlay doing g, then h.
- makeExtensible f: the fixed point of f with an extra attribute
  extend = overlay: the same, extended by overlay (and extensible again).
"""
hint = "fix = f: let x = f x; in x;  extends = overlay: f: final: let prev = f final; in prev // overlay final prev;"
explanation = """
Laziness is what makes `let x = f x; in x` work: x is a thunk, and f may use
attributes of x as long as it does not need x itself to decide which attributes
exist. That is the whole trick behind `self` in package sets and `config` in
modules.

extends layers an overlay: prev is the set before it, final the set after every
layer, the fixed point. Overriding a value in prev changes it for everyone who
reads it from final: this is how an overlay changing openssl rebuilds everything
that depends on it. makeExtensible stores how to rebuild itself, which is how
pkgs.extend and lib.extend work.
"""

[starter]
nix = '''
{
  fix = f: throw "todo";

  extends = overlay: f: throw "todo";

  composeExtensions = g: h: throw "todo";

  makeExtensible = f: throw "todo";
}
'''

[setup]
nix = '''
own = import file;
base = self: { a = 1; b = self.a + 1; };
'''

[checks]
nix = '''
(check "fix" (own.fix base) { a = 1; b = 2; })
(check "fix with forward references" (own.fix (self: { f3 = self.f1 + self.f2; f2 = self.f0 + self.f1; f1 = 1; f0 = 0; })).f3 2)
(check "extends: final sees the overlay" (own.fix (own.extends (final: prev: { a = 10; c = prev.b * 2; }) base)) { a = 10; b = 11; c = 22; })
(check "same as lib.extends" (own.fix (own.extends (final: prev: { b = prev.b + final.a; }) base)) (lib.fix (lib.extends (final: prev: { b = prev.b + final.a; }) base)))
(check "composeExtensions applies g, then h" (own.fix (own.extends (own.composeExtensions (final: prev: { a = prev.a + 1; }) (final: prev: { a = prev.a * 10; })) base)).a 20)
(check "makeExtensible" (builtins.removeAttrs (own.makeExtensible base) [ "extend" ]) { a = 1; b = 2; })
(check "extend" ((own.makeExtensible base).extend (final: prev: { a = 5; })).b 6)
(check "extend twice" (((own.makeExtensible base).extend (final: prev: { a = 5; })).extend (final: prev: { b = prev.b * 100; })).b 600)
'''

[solutions]
nix = '''
rec {
  fix = f: let x = f x; in x;

  extends = overlay: f: final:
    let prev = f final;
    in prev // overlay final prev;

  composeExtensions = g: h: final: prev:
    let fromG = g final prev;
    in fromG // h final (prev // fromG);

  makeExtensible = f:
    fix (self: f self // {
      extend = overlay: makeExtensible (extends overlay f);
    });
}
'''
