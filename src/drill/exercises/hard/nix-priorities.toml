title = "Module priorities and merging"
kind = "code"
file = "override.nix"
tags = ["nix", "modules", "priorities", "merging"]
target = 600
statement = """
base.nix declares some options and sets them. Without touching base.nix, write
override.nix, a module evaluated after it (lib.evalModules with both), so that
the final config is:
- editor = "vim"       (base: mkDefault "nano")
- port = 8080          (base: 80, at normal priority)
- packages = [ "htop" "git" "curl" "jq" ]   (base: [ "git" "curl" ])
- motd = "Welcome\\nHave fun"               (base: "Welcome"; a lines option)
- features = { debug = true; logs = true; telemetry = false; }
  (base: telemetry and logs on)
Try it: nix eval --impure --expr '(import <nixpkgs/lib>).evalModules { modules = [ ./base.nix ./override.nix ]; }' …
"""
hint = "A plain value beats mkDefault (1000); two plain values conflict, so mkForce (50); mkBefore and mkAfter set the order."
explanation = """
Every definition has a priority, lower winning: mkOptionDefault 1500, mkDefault
1000, a plain value 100, mkForce 50; lib.mkOverride n sets any. Only the
definitions with the best priority are kept, then merged by the option's type:
lists are concatenated, lines joined with newlines, attribute sets merged key
by key, while two different values of a str, port or bool are a conflict, an
error.

Definitions of the same order are merged in an order you should not rely on
(here, the later module comes first): mkBefore and mkAfter (mkOrder 500 and
1500, against 1000 by default) are what decides where a list's items, or a
lines option's lines, end up.
"""

[files]
"base.nix" = '''
{ lib, ... }:
{
  options = {
    editor = lib.mkOption { type = lib.types.str; };
    port = lib.mkOption { type = lib.types.port; };
    packages = lib.mkOption { type = lib.types.listOf lib.types.str; default = [ ]; };
    motd = lib.mkOption { type = lib.types.lines; default = ""; };
    features = lib.mkOption { type = lib.types.attrsOf lib.types.bool; default = { }; };
  };

  config = {
    editor = lib.mkDefault "nano";
    port = 80;
    packages = [ "git" "curl" ];
    motd = "Welcome";
    features = {
      telemetry = true;
      logs = true;
    };
  };
}
'''

[starter]
nix = '''
{ lib, ... }:
{
}
'''

[setup]
nix = '''
config = (lib.evalModules { modules = [ (dir + "/base.nix") file ]; }).config;
'''

[checks]
nix = '''
(check "editor" config.editor "vim")
(check "port" config.port 8080)
(check "packages" config.packages [ "htop" "git" "curl" "jq" ])
(check "motd" config.motd "Welcome\nHave fun")
(check "features" config.features { debug = true; logs = true; telemetry = false; })
'''

[solutions]
nix = '''
{ lib, ... }:
{
  editor = "vim";
  port = lib.mkForce 8080;
  packages = lib.mkMerge [ (lib.mkBefore [ "htop" ]) (lib.mkAfter [ "jq" ]) ];
  motd = lib.mkAfter "Have fun";
  features = {
    telemetry = lib.mkForce false;
    debug = true;
  };
}
'''

[[variants]]
statement = """
base.nix declares some options and sets them. Without touching base.nix, write
override.nix, a module evaluated after it (lib.evalModules with both), so that
the final config is:
- role = "server"
- editor = "vi"        (base: mkForce "nano")
- packages = [ "git" "tmux" "htop" ] when role is "server", and [ "git" ] for any
  other role: make it conditional on config.role, not on a constant
- motd = "Hi\\nWelcome\\nBye"   (base: "Welcome"; a lines option)
- limits = { files = 4096; procs = 512; }   (base: { files = 1024; }; one mkMerge)
"""
hint = "lib.mkOverride 10 beats mkForce (50); packages = lib.mkIf (config.role == \"server\") (…); mkBefore / mkAfter for the order."
[variants.files]
"base.nix" = '''
{ lib, ... }:
{
  options = {
    role = lib.mkOption { type = lib.types.enum [ "server" "desktop" ]; default = "desktop"; };
    editor = lib.mkOption { type = lib.types.str; };
    packages = lib.mkOption { type = lib.types.listOf lib.types.str; default = [ ]; };
    motd = lib.mkOption { type = lib.types.lines; default = ""; };
    limits = lib.mkOption { type = lib.types.attrsOf lib.types.int; default = { }; };
  };

  config = {
    editor = lib.mkForce "nano";
    packages = [ "git" ];
    motd = "Welcome";
    limits.files = 1024;
  };
}
'''
[variants.setup]
nix = '''
evaluate = extra: (lib.evalModules { modules = [ (dir + "/base.nix") file extra ]; }).config;
config = evaluate { };
desktop = evaluate { role = lib.mkOverride 0 "desktop"; };
'''
[variants.checks]
nix = '''
(check "role" config.role "server")
(check "editor" config.editor "vi")
(check "packages" config.packages [ "git" "tmux" "htop" ])
(check "packages follow the role" desktop.packages [ "git" ])
(check "motd" config.motd "Hi\nWelcome\nBye")
(check "limits" config.limits { files = 4096; procs = 512; })
'''
[variants.solutions]
nix = '''
{ config, lib, ... }:
{
  role = "server";
  editor = lib.mkOverride 10 "vi";
  packages = lib.mkIf (config.role == "server") (lib.mkAfter [ "tmux" "htop" ]);
  motd = lib.mkMerge [ (lib.mkBefore "Hi") (lib.mkAfter "Bye") ];
  limits = lib.mkMerge [
    { files = lib.mkForce 4096; }
    { procs = 512; }
  ];
}
'''
