title = "Generic iterators"
kind = "code"
tags = ["java", "generics", "iterators", "wildcards"]
target = 900
statement = """
- class PeekingIterator<T> implements Iterator<T> wraps an iterator and adds
  peek(), which returns the next element without consuming it. peek() and next()
  throw NoSuchElementException when exhausted. It accepts an Iterator of any
  subtype of T.
- Iterators.filtered(source, keep): a lazy Iterator<T> over the elements that
  pass keep. It must accept a predicate on any supertype of T (a
  Predicate<Object> for an Iterator<String>), and work on infinite iterators.
"""
hint = "Iterator<? extends T> source, a cached element plus a 'peeked' flag; Predicate<? super T>; an anonymous Iterator built on a PeekingIterator."

[starter]
java = '''
import java.util.*;
import java.util.function.*;

class PeekingIterator<T> implements Iterator<T> {
}

class Iterators {
}
'''

[checks]
java = '''
PeekingIterator<Integer> it = new PeekingIterator<>(List.of(1, 2, 3).iterator());
check("peek", it.peek(), 1);
check("peek twice", it.peek(), 1);
check("next after peek", it.next(), 1);
check("next", it.next(), 2);
check("hasNext", it.hasNext(), true);
check("peek the last", it.peek(), 3);
check("next the last", it.next(), 3);
check("exhausted", it.hasNext(), false);
checkThrows("peek when exhausted", NoSuchElementException.class, it::peek);
checkThrows("next when exhausted", NoSuchElementException.class, it::next);
PeekingIterator<Number> numbers = new PeekingIterator<>(List.of(1, 2).iterator());
check("accepts subtypes", numbers.peek(), 1);
Iterator<Integer> evens = Iterators.filtered(Stream.iterate(0, n -> n + 1).iterator(), n -> n % 2 == 0);
check("filtered infinite iterator", List.of(evens.next(), evens.next(), evens.next()), List.of(0, 2, 4));
Predicate<Object> notNull = Objects::nonNull;
Iterator<String> words = Iterators.filtered(Arrays.asList("a", null, "b", null).iterator(), notNull);
check("predicate on a supertype", words.next() + words.next(), "ab");
check("filtered exhausted", words.hasNext(), false);
'''

[solutions]
java = '''
import java.util.*;
import java.util.function.*;

class PeekingIterator<T> implements Iterator<T> {
    private final Iterator<? extends T> source;
    private T next;
    private boolean peeked;

    PeekingIterator(Iterator<? extends T> source) {
        this.source = source;
    }

    T peek() {
        if (!peeked) {
            next = source.next();  // throws NoSuchElementException when exhausted
            peeked = true;
        }
        return next;
    }

    @Override
    public boolean hasNext() {
        return peeked || source.hasNext();
    }

    @Override
    public T next() {
        if (!peeked) return source.next();
        peeked = false;
        T value = next;
        next = null;
        return value;
    }
}

class Iterators {
    static <T> Iterator<T> filtered(Iterator<T> source, Predicate<? super T> keep) {
        PeekingIterator<T> it = new PeekingIterator<>(source);
        return new Iterator<>() {
            private void skipRejected() {
                while (it.hasNext() && !keep.test(it.peek())) it.next();
            }

            @Override
            public boolean hasNext() {
                skipRejected();
                return it.hasNext();
            }

            @Override
            public T next() {
                skipRejected();
                return it.next();
            }
        };
    }
}
'''
