tm = TimeMap()
tm.set("color", "red", 10)
tm.set("color", "blue", 20)
check("before any version", tm.get("color", 5), None)
check("exact timestamp", tm.get("color", 10), "red")
check("between two versions", tm.get("color", 15), "red")
check("after the last version", tm.get("color", 99), "blue")
check("unknown key", tm.get("size", 99), None)
tm.set("color", "green", 15)
check("out-of-order insertion", tm.get("color", 17), "green")
check("later version unaffected", tm.get("color", 20), "blue")
tm.set("color", "black", 20)
check("replacing a version", tm.get("color", 25), "black")
big = TimeMap()
for t in range(0, 200_000, 2):
    big.set("k", str(t), t)
check("many versions", big.get("k", 150_001), "150000")
hits = sum(big.get("k", t) == str(t - t % 2) for t in range(1, 200_000, 7))
check("many lookups", hits, len(range(1, 200_000, 7)))
