[solutions]
python = '''
from bisect import bisect_right
from collections import defaultdict


class TimeMap:
    def __init__(self):
        self.times = defaultdict(list)  # key -> sorted timestamps
        self.values = defaultdict(list)  # key -> values, aligned with times

    def set(self, key: str, value: str, timestamp: int) -> None:
        times, values = self.times[key], self.values[key]
        i = bisect_right(times, timestamp)
        if i and times[i - 1] == timestamp:
            values[i - 1] = value
        else:
            times.insert(i, timestamp)
            values.insert(i, value)

    def get(self, key: str, timestamp: int) -> str | None:
        i = bisect_right(self.times.get(key, []), timestamp)
        return self.values[key][i - 1] if i else None
'''
cpp = '''
#include <bits/stdc++.h>

class TimeMap {
public:
    void set(const std::string& key, std::string value, int timestamp) {
        history_[key][timestamp] = std::move(value);
    }

    std::optional<std::string> get(const std::string& key, int timestamp) const {
        auto found = history_.find(key);  // operator[] is not const: it may insert
        if (found == history_.end()) return std::nullopt;
        auto it = found->second.upper_bound(timestamp);  // first version after timestamp
        if (it == found->second.begin()) return std::nullopt;
        return std::prev(it)->second;
    }

private:
    std::unordered_map<std::string, std::map<int, std::string>> history_;
};
'''
java = '''
import java.util.*;

class TimeMap {
    private final Map<String, TreeMap<Integer, String>> history = new HashMap<>();

    void set(String key, String value, int timestamp) {
        history.computeIfAbsent(key, k -> new TreeMap<>()).put(timestamp, value);
    }

    String get(String key, int timestamp) {
        TreeMap<Integer, String> versions = history.get(key);
        if (versions == null) return null;
        Map.Entry<Integer, String> entry = versions.floorEntry(timestamp);
        return entry == null ? null : entry.getValue();
    }
}
'''
