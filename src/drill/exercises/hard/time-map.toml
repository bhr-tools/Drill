title = "Versioned key-value store"
kind = "code"
tags = ["design", "binary-search", "ordered-map"]
target = 900
statement = """
A TimeMap stores several versions of each key:
- set(key, value, timestamp) records value at timestamp (timestamps may arrive
  in any order; setting an existing timestamp replaces its value);
- get(key, timestamp) returns the value with the greatest timestamp <= timestamp,
  or "nothing".
get must be logarithmic: the checks store a million versions (100 000 in Python).

Python: get returns None when there is nothing.
C++: get is const and returns std::optional<std::string>.
Java: get returns null when there is nothing.
"""
hint = "Python: sorted timestamp lists + bisect. C++: std::map<int, std::string>::upper_bound, then step back. Java: TreeMap.floorEntry."

