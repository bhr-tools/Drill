title = "Lazy iterator toolkit"
kind = "code"
tags = ["python", "generator", "itertools", "iterators"]
target = 720
statement = """
Three generators that must work on any iterable, infinite ones included, and
consume their input in a single pass:
- windows(iterable, n): tuples of n consecutive items (sliding by one);
- chunked(iterable, n): lists of n items, the last one possibly shorter;
- interleave(*iterables): one item from each in turn, skipping the exhausted
  ones, until all are exhausted.
"""
hint = "collections.deque(maxlen=n); itertools.islice on a single iter() with the walrus operator; a deque of iterators rotated with popleft / append."

