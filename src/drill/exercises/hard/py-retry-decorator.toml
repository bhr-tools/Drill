title = "A configurable decorator"
kind = "code"
tags = ["python", "decorator", "functools", "closures"]
target = 720
statement = """
retry calls the decorated function again when it raises, up to `times` calls in
total, then re-raises the last exception. It works both bare and configured:

    @retry                                       # times=3, exceptions=(Exception,)
    @retry(times=5, exceptions=(ValueError,))    # keyword-only arguments

- only the listed exception types (and subclasses) are retried, others propagate
  at once;
- the wrapper keeps the original's name, docstring and __wrapped__;
- wrapper.attempts is the number of calls made by the last invocation.
"""
hint = "def retry(func=None, *, times=3, exceptions=(Exception,)); with func None, return a partial of retry. functools.wraps does the metadata."

[starter]
python = '''
import functools


def retry(func=None, *, times=3, exceptions=(Exception,)):
    pass
'''

[setup]
python = '''
calls = []
counter = {"n": 0}


@retry(times=3, exceptions=(ValueError,))
def flaky(n):
    """Fails until the third call."""
    calls.append(n)
    if len(calls) < 3:
        raise ValueError("not yet")
    return n * 2


@retry(times=2)
def always_fails():
    raise KeyError("nope")


@retry(times=5, exceptions=(ValueError,))
def wrong_kind():
    counter["n"] += 1
    raise TypeError("not retried")


@retry
def bare():
    return "ok"


@retry(times=4, exceptions=(LookupError,))
def subclass_error():
    counter["n"] += 1
    raise IndexError("a LookupError")
'''

[checks]
python = '''
check("eventually succeeds", flaky(21), 42)
check("called three times", calls, [21, 21, 21])
check("attempts recorded", flaky.attempts, 3)
check("name kept", flaky.__name__, "flaky")
check("docstring kept", flaky.__doc__, "Fails until the third call.")
raises("re-raises the last error", KeyError, always_fails)
check("attempts after failing", always_fails.attempts, 2)
raises("other exceptions are not retried", TypeError, wrong_kind)
check("a single call", counter["n"], 1)
counter["n"] = 0
raises("subclasses are retried", IndexError, subclass_error)
check("every attempt used", counter["n"], 4)
check("usable bare", bare(), "ok")
check("bare: one attempt", bare.attempts, 1)
check("__wrapped__", bare.__wrapped__(), "ok")
'''

[solutions]
python = '''
import functools


def retry(func=None, *, times=3, exceptions=(Exception,)):
    if func is None:
        # Configured use, @retry(...): the function comes in the next call
        return functools.partial(retry, times=times, exceptions=exceptions)

    @functools.wraps(func)
    def wrapper(*args, **kwargs):
        for attempt in range(1, times + 1):
            wrapper.attempts = attempt
            try:
                return func(*args, **kwargs)
            except exceptions:
                if attempt == times:
                    raise

    wrapper.attempts = 0
    return wrapper
'''
