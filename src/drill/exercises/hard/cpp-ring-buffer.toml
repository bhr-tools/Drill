title = "A ring buffer with iterators"
kind = "code"
tags = ["cpp", "templates", "iterators", "ranges"]
target = 1200
statement = """
template <class T, std::size_t N> class RingBuffer keeps the last N pushed values:
- push(value) appends, overwriting the oldest value when full; pop_front();
- size(), empty(), full(), and capacity() usable at compile time;
- front(), back(), and operator[](i) with 0 the oldest;
- a const_iterator from begin() / end(), oldest to newest, which satisfies
  std::forward_iterator — so range-for, std::accumulate and std::ranges
  algorithms all work.
"""
hint = "std::array<T, N> + start index + size; the iterator holds a pointer to the ring and a logical index, with iterator_category, value_type, difference_type, reference, a default constructor and a defaulted ==."

[starter]
cpp = '''
#include <bits/stdc++.h>

template <class T, std::size_t N>
class RingBuffer {
public:
};
'''

[checks]
cpp = '''
using Ring = RingBuffer<int, 3>;
static_assert(Ring::capacity() == 3, "capacity() must be static and constexpr");
Ring r;
CHECK(r.empty());
r.push(1);
r.push(2);
CHECK_EQ(r.size(), std::size_t{2});
CHECK_EQ(r.front(), 1);
CHECK_EQ(r.back(), 2);
r.push(3);
r.push(4);
CHECK(r.full());
CHECK_EQ(r.front(), 2);
CHECK_EQ(r[0], 2);
CHECK_EQ(r[2], 4);
CHECK_EQ(std::vector<int>(r.begin(), r.end()), std::vector<int>{2, 3, 4});
int total = 0;
for (int x : r) total += x;
CHECK_EQ(total, 9);
CHECK_EQ(std::accumulate(r.begin(), r.end(), 0), 9);
CHECK(std::forward_iterator<Ring::const_iterator>);
CHECK(std::ranges::find(r, 3) != r.end());
CHECK(std::ranges::find(r, 1) == r.end());
r.pop_front();
CHECK_EQ(r.front(), 3);
CHECK_EQ(r.size(), std::size_t{2});
RingBuffer<std::string, 2> words;
words.push("a");
words.push("b");
words.push("c");
CHECK_EQ(std::vector<std::string>(words.begin(), words.end()), std::vector<std::string>{"b", "c"});
std::string moved = "kept";
words.push(std::move(moved));
CHECK_EQ(words.back(), std::string("kept"));
'''

[solutions]
cpp = '''
#include <bits/stdc++.h>

template <class T, std::size_t N>
class RingBuffer {
public:
    class const_iterator {
    public:
        using iterator_category = std::forward_iterator_tag;
        using value_type = T;
        using difference_type = std::ptrdiff_t;
        using pointer = const T*;
        using reference = const T&;

        const_iterator() = default;
        const_iterator(const RingBuffer* ring, std::size_t index) : ring_(ring), index_(index) {}

        reference operator*() const { return (*ring_)[index_]; }
        pointer operator->() const { return &**this; }
        const_iterator& operator++() {
            ++index_;
            return *this;
        }
        const_iterator operator++(int) {
            auto copy = *this;
            ++index_;
            return copy;
        }
        bool operator==(const const_iterator&) const = default;

    private:
        const RingBuffer* ring_ = nullptr;
        std::size_t index_ = 0;  // logical position, 0 being the oldest value
    };

    static constexpr std::size_t capacity() { return N; }
    std::size_t size() const { return size_; }
    bool empty() const { return size_ == 0; }
    bool full() const { return size_ == N; }

    void push(T value) {
        items_[(start_ + size_) % N] = std::move(value);
        if (full()) start_ = (start_ + 1) % N;  // the oldest value was just overwritten
        else ++size_;
    }

    void pop_front() {
        start_ = (start_ + 1) % N;
        --size_;
    }

    T& operator[](std::size_t i) { return items_[(start_ + i) % N]; }
    const T& operator[](std::size_t i) const { return items_[(start_ + i) % N]; }
    const T& front() const { return (*this)[0]; }
    const T& back() const { return (*this)[size_ - 1]; }

    const_iterator begin() const { return {this, 0}; }
    const_iterator end() const { return {this, size_}; }

private:
    std::array<T, N> items_{};
    std::size_t start_ = 0;
    std::size_t size_ = 0;
};
'''
