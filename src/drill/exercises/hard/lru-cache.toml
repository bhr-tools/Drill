title = "Generic LRU cache"
kind = "code"
tags = ["design", "hashmap", "linked-list", "generics"]
target = 900
statement = """
Implement a generic least-recently-used cache with a fixed capacity.
- get returns the value of a key (or "nothing") and marks the key as most recently used;
- put inserts or updates a key, marking it as most recently used; when the cache
  goes over capacity, the least recently used key is evicted.
Both operations must run in O(1): the checks perform a million operations
(100 000 in Python).

Python: get(key, default=None) and len(cache).
C++: template <class K, class V>; get returns std::optional<V>; size().
Java: class LRUCache<K, V>; get returns null when absent; size().
"""
hint = "Python: collections.OrderedDict. C++: std::list of pairs + unordered_map of list iterators, std::list::splice. Java: LinkedHashMap with accessOrder = true and removeEldestEntry."

