title = "A derivation without stdenv"
kind = "code"
file = "drv.nix"
tags = ["nix", "derivations", "store"]
target = 600
statement = """
Under mkDerivation there is builtins.derivation: a name, a system, a builder
and its arguments, every other attribute becoming an environment variable of
the build. Write drv.nix, a function { system, bash, coreutils }: returning
a derivation, with no stdenv:
- name "drill-raw", the system given, bash as the builder, run with -c and a script;
- two outputs, out and doc;
- an attribute GREETING = "Hello from a raw derivation", that the script writes
  to $out/hello.txt (with a newline);
- $doc/README containing "docs" and a newline.
coreutils' programs are not on PATH: the build environment is empty.
"""
hint = "derivation { name = …; inherit system GREETING; builder = \"${bash}/bin/bash\"; args = [ \"-c\" '' … '' ]; outputs = [ \"out\" \"doc\" ]; }"
explanation = """
A derivation is a recipe stored as a .drv file: the builder, its arguments and
its environment, with the store paths of everything it uses. Nix runs the
builder in a sandbox where only those paths exist, with every attribute as an
environment variable ($out and $doc are the output paths), and PATH set to a
path that does not exist: that is why commands need their store path, and why
stdenv (which sets up PATH, phases, the compiler) is a convenience, not magic.

Each output is a separate store path: a package's docs or headers can be
installed or garbage-collected apart from it.
"""

[starter]
nix = '''
{ system, bash, coreutils }:

derivation {
}
'''

[setup]
nix = '''
raw = import file { inherit system; inherit (pkgs) bash coreutils; };
'''

[checks]
nix = '''
(check "a derivation" (raw.type or null) "derivation")
(check "its name" (raw.name or null) "drill-raw")
(check "two outputs" (raw.outputs or null) [ "out" "doc" ])
(check "no stdenv" (raw.drvAttrs ? stdenv) false)
(check "GREETING is an attribute" (raw.drvAttrs.GREETING or null) "Hello from a raw derivation")
(check "$out/hello.txt" (builtins.readFile "${raw}/hello.txt") "Hello from a raw derivation\n")
(check "$doc/README" (builtins.readFile "${raw.doc}/README") "docs\n")
'''

[solutions]
nix = '''
{ system, bash, coreutils }:

derivation {
  name = "drill-raw";
  inherit system;
  builder = "${bash}/bin/bash";
  args = [
    "-c"
    ''
      ${coreutils}/bin/mkdir -p $out $doc
      echo "$GREETING" > $out/hello.txt
      echo docs > $doc/README
    ''
  ];
  outputs = [ "out" "doc" ];
  GREETING = "Hello from a raw derivation";
}
'''

[[variants]]
statement = """
Two derivations without stdenv, one depending on the other. Write drv.nix, a
function { system, bash, coreutils }: returning { base = …; doubled = …; }, two
builtins.derivation:
- base: writes 21 (and a newline) to $out/value;
- doubled: reads base's value and writes twice it to $out/value, using
  coreutils' expr: referring to base in its script makes it a dependency.
Both use bash as the builder (-c and a script); coreutils is not on PATH.
"""
hint = "In doubled's script: ${coreutils}/bin/expr $(${coreutils}/bin/cat ${base}/value) \\* 2 > $out/value"
explanation = """
Interpolating ${base} in doubled's script puts base's store path in the string,
with a context that records the dependency: Nix builds base first, and makes its
path (and only its paths) visible in doubled's sandbox. Dependencies are never
declared separately: they are whatever the derivation's strings refer to.
"""
[variants.starter]
nix = '''
{ system, bash, coreutils }:

rec {
  base = derivation {
  };

  doubled = derivation {
  };
}
'''
[variants.checks]
nix = '''
(check "base is a derivation" (raw.base.type or null) "derivation")
(check "base's value" (builtins.readFile "${raw.base}/value") "21\n")
(check "doubled depends on base" (contains raw.base.drvPath (builtins.readFile raw.doubled.drvPath)) true)
(check "doubled's value" (builtins.readFile "${raw.doubled}/value") "42\n")
(check "no stdenv" (raw.doubled.drvAttrs ? stdenv) false)
'''
[variants.solutions]
nix = '''
{ system, bash, coreutils }:

rec {
  base = derivation {
    name = "base";
    inherit system;
    builder = "${bash}/bin/bash";
    args = [ "-c" "${coreutils}/bin/mkdir $out && echo 21 > $out/value" ];
  };

  doubled = derivation {
    name = "doubled";
    inherit system;
    builder = "${bash}/bin/bash";
    args = [
      "-c"
      ''
        ${coreutils}/bin/mkdir $out
        ${coreutils}/bin/expr $(${coreutils}/bin/cat ${base}/value) \* 2 > $out/value
      ''
    ];
  };
}
'''
