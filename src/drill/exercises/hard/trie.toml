[solutions]
python = '''
class _Node:
    __slots__ = ("children", "end", "count")

    def __init__(self):
        self.children = {}
        self.end = False
        self.count = 0  # words ending in this subtree


class Trie:
    def __init__(self):
        self.root = _Node()

    def _find(self, prefix):
        node = self.root
        for c in prefix:
            node = node.children.get(c)
            if node is None:
                return None
        return node

    def insert(self, word: str) -> bool:
        if word in self:
            return False
        node = self.root
        node.count += 1
        for c in word:
            node = node.children.setdefault(c, _Node())
            node.count += 1
        node.end = True
        return True

    def __contains__(self, word: str) -> bool:
        node = self._find(word)
        return node is not None and node.end

    def __len__(self) -> int:
        return self.root.count

    def count_prefix(self, prefix: str) -> int:
        node = self._find(prefix)
        return node.count if node else 0

    def remove(self, word: str) -> bool:
        if word not in self:
            return False
        node = self.root
        node.count -= 1
        for c in word:
            child = node.children[c]
            child.count -= 1
            if child.count == 0:
                del node.children[c]  # prune the branch left empty
                return True
            node = child
        node.end = False
        return True

    def complete(self, prefix: str, limit: int) -> list[str]:
        found = []

        def walk(node, path):
            if len(found) == limit:
                return
            if node.end:
                found.append(path)
            for c in sorted(node.children):
                walk(node.children[c], path + c)

        node = self._find(prefix)
        if node:
            walk(node, prefix)
        return found
'''
cpp = '''
#include <bits/stdc++.h>

class Trie {
public:
    bool insert(std::string_view word) {
        if (contains(word)) return false;
        Node* node = &root_;
        ++node->count;
        for (char c : word) {
            auto& child = node->children[c];
            if (!child) child = std::make_unique<Node>();
            node = child.get();
            ++node->count;
        }
        node->end = true;
        return true;
    }

    bool contains(std::string_view word) const {
        const Node* node = find(word);
        return node && node->end;
    }

    std::size_t count_prefix(std::string_view prefix) const {
        const Node* node = find(prefix);
        return node ? node->count : 0;
    }

    bool remove(std::string_view word) {
        if (!contains(word)) return false;
        Node* node = &root_;
        --node->count;
        for (char c : word) {
            auto it = node->children.find(c);
            Node* child = it->second.get();
            if (--child->count == 0) {
                node->children.erase(it);  // the unique_ptr frees the whole branch
                return true;
            }
            node = child;
        }
        node->end = false;
        return true;
    }

    std::vector<std::string> complete(std::string_view prefix, std::size_t limit) const {
        std::vector<std::string> found;
        std::string path(prefix);
        if (const Node* node = find(prefix)) collect(*node, path, limit, found);
        return found;
    }

    std::size_t size() const { return root_.count; }

private:
    struct Node {
        std::map<char, std::unique_ptr<Node>> children;  // ordered: completions come sorted
        std::size_t count = 0;  // words ending in this subtree
        bool end = false;
    };

    const Node* find(std::string_view prefix) const {
        const Node* node = &root_;
        for (char c : prefix) {
            auto it = node->children.find(c);
            if (it == node->children.end()) return nullptr;
            node = it->second.get();
        }
        return node;
    }

    static void collect(const Node& node, std::string& path, std::size_t limit,
                        std::vector<std::string>& found) {
        if (found.size() == limit) return;
        if (node.end) found.push_back(path);
        for (const auto& [c, child] : node.children) {
            path.push_back(c);
            collect(*child, path, limit, found);
            path.pop_back();
        }
    }

    Node root_;
};
'''
java = '''
import java.util.*;

class Trie {
    private static final class Node {
        final TreeMap<Character, Node> children = new TreeMap<>();  // ordered completions
        int count;  // words ending in this subtree
        boolean end;
    }

    private final Node root = new Node();

    boolean insert(String word) {
        if (contains(word)) return false;
        Node node = root;
        node.count++;
        for (char c : word.toCharArray()) {
            node = node.children.computeIfAbsent(c, k -> new Node());
            node.count++;
        }
        node.end = true;
        return true;
    }

    boolean contains(String word) {
        Node node = find(word);
        return node != null && node.end;
    }

    int countPrefix(String prefix) {
        Node node = find(prefix);
        return node == null ? 0 : node.count;
    }

    boolean remove(String word) {
        if (!contains(word)) return false;
        Node node = root;
        node.count--;
        for (char c : word.toCharArray()) {
            Node child = node.children.get(c);
            if (--child.count == 0) {
                node.children.remove(c);
                return true;
            }
            node = child;
        }
        node.end = false;
        return true;
    }

    List<String> complete(String prefix, int limit) {
        List<String> found = new ArrayList<>();
        Node node = find(prefix);
        if (node != null) collect(node, new StringBuilder(prefix), limit, found);
        return found;
    }

    int size() {
        return root.count;
    }

    private Node find(String prefix) {
        Node node = root;
        for (char c : prefix.toCharArray()) {
            node = node.children.get(c);
            if (node == null) return null;
        }
        return node;
    }

    private static void collect(Node node, StringBuilder path, int limit, List<String> found) {
        if (found.size() == limit) return;
        if (node.end) found.add(path.toString());
        for (Map.Entry<Character, Node> e : node.children.entrySet()) {
            path.append(e.getKey());
            collect(e.getValue(), path, limit, found);
            path.deleteCharAt(path.length() - 1);
        }
    }
}
'''
