title = "Trie with counts and completion"
kind = "code"
tags = ["design", "trie", "tree", "recursion"]
target = 1200
statement = """
A set of words stored as a trie:
- insert(word) adds a word, returning false if it was already there;
- contains(word); count_prefix(prefix): how many words start with prefix, in
  O(len(prefix));
- remove(word) returns false if absent, and frees the branches left empty;
- complete(prefix, limit): up to limit words starting with prefix, in
  alphabetical order;
- the number of words: len(trie) / size().

Python: `word in trie` for contains. Java: countPrefix.
C++: queries are const; nodes are owned with std::unique_ptr.
"""
hint = "Each node keeps its children in an ordered map, an end-of-word flag and the number of words in its subtree; a depth-first walk gives sorted completions."

