title = "Building a string"
tags = ["optim", "string", "immutability"]
target = 300
signature = "reverse_words(s: str) -> str"
complexity = "O(n)"
statement = """
reverse_words(s) returns the words of s, separated by single spaces, in reverse order.

The code you start with is correct, but too slow for the performance test.
1. Estimate its complexity, then press c to measure it.
2. Make it fast enough, and measure again.
"""
hint = "Prepending to a string copies the whole string every time."
explanation = """
Python and Java strings are immutable, so word + " " + result creates a new
string and copies both parts into it. Prepending to a result of length L costs
O(L), and the result keeps growing: 1 + 2 + ... + n = O(n²) characters copied.
C++ strings are mutable, but word + " " + result also builds a new string.

The fix is to copy each character a bounded number of times:
- collect the parts and join them once at the end: " ".join(...),
  String.join(...), or a single std::string with reserve();
- or append at the end of a builder (StringBuilder, std::string +=). Appending is
  amortized O(1) per character, because the buffer doubles its capacity when full,
  so the copies add up to O(n).

Watch out for CPython: s += t can be fast, because when nothing else references
s, CPython extends it in place. That is an implementation detail; prepending, or a
second reference to s, gets the quadratic cost back. Joining is the reliable
idiom in every language.
"""
tests = [
  { in = ["the sky is blue"], out = "blue is sky the" },
  { in = ["one"], out = "one" },
  { in = ["a b"], out = "b a" },
  { in = ["x y z"], out = "z y x" },
  { in = [""], out = "" },
]

[starter]
python = '''
def reverse_words(s: str) -> str:
    result = ""
    for word in s.split(" "):
        result = word + " " + result if result else word
    return result
'''
cpp = '''
#include <bits/stdc++.h>
using namespace std;


            string reverseWords(const string& s) {
                string result, word;
                istringstream in(s);
                bool first = true;
                while (getline(in, word, ' ')) {
                    result = first ? word : word + " " + result;
                    first = false;
                }
                return result;
            }
'''
java = '''
import java.util.*;


            class Solution {
                public String reverseWords(String s) {
                    String result = "";
                    boolean first = true;
                    for (String word : s.split(" ")) {
                        result = first ? word : word + " " + result;
                        first = false;
                    }
                    return result;
                }
            }
'''

[solutions]
python = '''
def reverse_words(s: str) -> str:
    return " ".join(reversed(s.split(" ")))
'''
cpp = '''
string reverseWords(const string& s) {
    vector<string_view> words;
    string_view rest = s;
    while (true) {
        auto at = rest.find(' ');
        words.push_back(rest.substr(0, at));
        if (at == string_view::npos) break;
        rest.remove_prefix(at + 1);
    }
    string out;
    out.reserve(s.size());
    for (auto it = words.rbegin(); it != words.rend(); ++it) {
        if (it != words.rbegin()) out += ' ';
        out += *it;
    }
    return out;
}
'''
java = '''
public String reverseWords(String s) {
    List<String> words = Arrays.asList(s.split(" "));
    Collections.reverse(words);
    return String.join(" ", words);
}
'''

