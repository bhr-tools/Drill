title = "The card game queue"
tags = ["optim", "queue", "deque"]
target = 300
signature = "last_card(n: int) -> int"
complexity = "O(n)"
statement = """
A deck holds the cards 1 to n, 1 on top. Until a single card is left:
throw away the top card, then move the new top card to the bottom.
last_card(n) returns the last card.

The code you start with is correct, but too slow for the performance test.
1. Estimate its complexity, then press c to measure it.
2. Make it fast enough, and measure again.
"""
hint = "Removing the first element of a list, vector or ArrayList shifts all the others."
explanation = """
Lists, vectors and ArrayLists store their elements contiguously. Removing the
first one (list.pop(0), vector::erase(begin()), ArrayList.remove(0)) shifts every
other element one slot to the left: O(n) per removal. The game removes n times,
so it costs O(n²), even though each line of code looks like a single operation.
Only the front is costly: removing at the end (pop(), pop_back()) is O(1).

A double-ended queue gives O(1) removal at both ends: collections.deque,
std::deque or std::queue, ArrayDeque. It is a ring buffer or a list of blocks, so
the front moves instead of the data. The simulation becomes O(n).

Bonus: the game has a closed form. Write n = 2^m + r with 0 <= r < 2^m; the last
card is 2r, or n when r = 0 (n is then a power of two). That gives O(1) time,
which shows that the right data structure is not always the end of the story.
"""
tests = [
  { in = [1], out = 1 },
  { in = [2], out = 2 },
  { in = [3], out = 2 },
  { in = [4], out = 4 },
  { in = [5], out = 2 },
  { in = [6], out = 4 },
  { in = [7], out = 6 },
  { in = [10], out = 4 },
  { in = [64], out = 64 },
  { in = [100], out = 72 },
]

[starter]
python = '''
def last_card(n: int) -> int:
    deck = list(range(1, n + 1))
    while len(deck) > 1:
        deck.pop(0)  # throw away the top card
        deck.append(deck.pop(0))  # move the next one to the bottom
    return deck[0]
'''
cpp = '''
#include <bits/stdc++.h>
using namespace std;


            int lastCard(int n) {
                vector<int> deck(n);
                iota(deck.begin(), deck.end(), 1);
                while (deck.size() > 1) {
                    deck.erase(deck.begin());  // throw away the top card
                    int top = deck.front();
                    deck.erase(deck.begin());
                    deck.push_back(top);  // move it to the bottom
                }
                return deck[0];
            }
'''
java = '''
import java.util.*;


            class Solution {
                public int lastCard(int n) {
                    List<Integer> deck = new ArrayList<>();
                    for (int i = 1; i <= n; i++) deck.add(i);
                    while (deck.size() > 1) {
                        deck.remove(0);  // throw away the top card
                        deck.add(deck.remove(0));  // move the next one to the bottom
                    }
                    return deck.get(0);
                }
            }
'''

[solutions]
python = '''
from collections import deque


def last_card(n: int) -> int:
    deck = deque(range(1, n + 1))
    while len(deck) > 1:
        deck.popleft()
        deck.append(deck.popleft())
    return deck[0]
'''
cpp = '''
int lastCard(int n) {
    queue<int> deck;
    for (int i = 1; i <= n; ++i) deck.push(i);
    while (deck.size() > 1) {
        deck.pop();
        deck.push(deck.front());
        deck.pop();
    }
    return deck.front();
}
'''
java = '''
public int lastCard(int n) {
    ArrayDeque<Integer> deck = new ArrayDeque<>();
    for (int i = 1; i <= n; i++) deck.addLast(i);
    while (deck.size() > 1) {
        deck.pollFirst();
        deck.addLast(deck.pollFirst());
    }
    return deck.peekFirst();
}
'''

