title = "Common elements"
tags = ["optim", "hashing", "set"]
target = 300
signature = "count_common(a: list[int], b: list[int]) -> int"
complexity = "O(n)"
statement = """
count_common(a, b) is the number of distinct values present in both a and b.

The code you start with is correct, but too slow for the performance test.
1. Estimate its complexity, then press c to measure it.
2. Make it fast enough, and measure again.
"""
hint = "Membership in a list is a linear scan; in a hash set it is O(1) on average."
explanation = """
The slow version asks "is x in b?" for every x of a. On a list, a vector or an
array, that question reads the elements one by one: O(m) for each of the n
values, so O(n·m) in total, 10^10 comparisons for two lists of 100 000. The
`common` list used to skip duplicates has the same problem.

A hash set answers membership in O(1) on average: hashing the value gives the
one bucket where it can be, so only that bucket is checked. Building the set of
a costs O(n) once; each of the m lookups is then O(1): O(n + m) in total.

- Python: set(a) & set(b) builds both sets and intersects them.
- C++: std::unordered_set; Java: HashSet (with boxing, so a constant factor slower).

Without hashing, sort both arrays (O(n log n)) and walk them together with two
pointers, as in a merge. That is the choice when memory is tight or the values
cannot be hashed. Keep in mind that "average O(1)" assumes a decent hash: crafted
inputs that all collide make a hash set linear again.
"""
tests = [
  { in = [[1, 2, 3], [2, 3, 4]], out = 2 },
  { in = [[1, 1, 1], [1]], out = 1 },
  { in = [[], [1]], out = 0 },
  { in = [[5, 6], [7]], out = 0 },
  { in = [[1, 2, 2, 3], [2, 2, 3, 3]], out = 2 },
]

[starter]
python = '''
def count_common(a: list[int], b: list[int]) -> int:
    common = []
    for x in a:
        if x in b and x not in common:
            common.append(x)
    return len(common)
'''
cpp = '''
#include <bits/stdc++.h>
using namespace std;


            int countCommon(vector<int>& a, vector<int>& b) {
                vector<int> common;
                for (int x : a)
                    if (find(b.begin(), b.end(), x) != b.end() && find(common.begin(), common.end(), x) == common.end())
                        common.push_back(x);
                return common.size();
            }
'''
java = '''
import java.util.*;


            class Solution {
                public int countCommon(int[] a, int[] b) {
                    List<Integer> common = new ArrayList<>();
                    for (int x : a) {
                        boolean inB = false;
                        for (int y : b)
                            if (y == x) {
                                inB = true;
                                break;
                            }
                        if (inB && !common.contains(x)) common.add(x);
                    }
                    return common.size();
                }
            }
'''

[solutions]
python = '''
def count_common(a: list[int], b: list[int]) -> int:
    return len(set(a) & set(b))
'''
cpp = '''
int countCommon(vector<int>& a, vector<int>& b) {
    unordered_set<int> inA(a.begin(), a.end()), both;
    for (int x : b)
        if (inA.contains(x)) both.insert(x);
    return both.size();
}
'''
java = '''
public int countCommon(int[] a, int[] b) {
    Set<Integer> inA = new HashSet<>();
    for (int x : a) inA.add(x);
    Set<Integer> both = new HashSet<>();
    for (int x : b)
        if (inA.contains(x)) both.add(x);
    return both.size();
}
'''

