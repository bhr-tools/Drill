[solutions]
python = '''
from collections import deque


def window_max(nums: list[int], k: int) -> list[int]:
    window = deque()  # indices, their values decreasing from front to back
    out = []
    for i, x in enumerate(nums):
        while window and nums[window[-1]] <= x:
            window.pop()
        window.append(i)
        if window[0] <= i - k:
            window.popleft()
        if i >= k - 1:
            out.append(nums[window[0]])
    return out
'''
cpp = '''
vector<int> windowMax(vector<int>& nums, int k) {
    deque<int> window;  // indices, their values decreasing from front to back
    vector<int> out;
    for (int i = 0; i < (int)nums.size(); ++i) {
        while (!window.empty() && nums[window.back()] <= nums[i]) window.pop_back();
        window.push_back(i);
        if (window.front() <= i - k) window.pop_front();
        if (i >= k - 1) out.push_back(nums[window.front()]);
    }
    return out;
}
'''
java = '''
public int[] windowMax(int[] nums, int k) {
    ArrayDeque<Integer> window = new ArrayDeque<>();  // indices, values decreasing
    int[] out = new int[nums.length - k + 1];
    for (int i = 0; i < nums.length; i++) {
        while (!window.isEmpty() && nums[window.peekLast()] <= nums[i]) window.pollLast();
        window.addLast(i);
        if (window.peekFirst() <= i - k) window.pollFirst();
        if (i >= k - 1) out[i - k + 1] = nums[window.peekFirst()];
    }
    return out;
}
'''

