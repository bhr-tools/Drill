import java.util.*;


            class Solution {
                public int[] windowMax(int[] nums, int k) {
                    int[] out = new int[nums.length - k + 1];
                    for (int i = 0; i + k <= nums.length; i++) {
                        int best = Integer.MIN_VALUE;
                        for (int j = i; j < i + k; j++) best = Math.max(best, nums[j]);
                        out[i] = best;
                    }
                    return out;
                }
            }
