title = "Sliding window maximum"
tags = ["optim", "monotonic-deque", "sliding-window"]
target = 600
signature = "window_max(nums: list[int], k: int) -> list[int]"
complexity = "O(n)"
statement = """
window_max(nums, k) returns the maximum of every window of k consecutive elements, from left to right (1 <= k <= len(nums)).

The code you start with is correct, but too slow for the performance test.
1. Estimate its complexity, then press c to measure it.
2. Make it fast enough, and measure again.
"""
hint = "Keep the indices of the window's candidates in a deque, their values decreasing: the front is the maximum."
explanation = """
Recomputing the maximum of each window reads k elements, n - k + 1 times:
O(n·k), which is quadratic when k is a fraction of n.

An element can be forgotten as soon as a larger one enters the window after it:
it will leave the window first, so it can never be the maximum again. The deque
keeps only the candidates, as indices with decreasing values:
- before pushing i, pop from the back every index whose value is <= nums[i];
- pop from the front the index that slid out of the window (i - k);
- the front is the maximum of the current window.

Each index is pushed once and popped at most once, so the n iterations do O(n)
work in total. The cost is amortized O(1) per step, even though one step can pop
many. A heap would also work, but in O(n log k), with stale entries to discard
lazily.

Python: collections.deque. C++: std::deque. Java: ArrayDeque, with peekLast and
pollLast at the back and peekFirst and pollFirst at the front.
"""
tests = [
  { in = [[1, 3, -1, -3, 5, 3, 6, 7], 3], out = [3, 3, 5, 5, 6, 7] },
  { in = [[1], 1], out = [1] },
  { in = [[4, 2], 2], out = [4] },
  { in = [[1, 2, 3, 4], 1], out = [1, 2, 3, 4] },
  { in = [[9, 8, 7, 6], 2], out = [9, 8, 7] },
  { in = [[2, 2, 2], 2], out = [2, 2] },
]

