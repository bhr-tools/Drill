title = "Running median"
tags = ["optim", "heap", "two-heaps"]
target = 720
signature = "running_medians(nums: list[int]) -> list[int]"
complexity = "O(n log n)"
statement = """
After each element of nums, report the median of the elements seen so far; with
an even count, the lower of the two middle values. running_medians returns
these n medians.

The code you start with is correct, but too slow for the performance test.
1. Estimate its complexity, then press c to measure it.
2. Make it fast enough, and measure again.
"""
hint = "Only the middle matters: a max-heap for the lower half and a min-heap for the upper half."
explanation = """
Sorting again after each new element costs at least O(n) per step. Even Timsort,
which spots the already sorted run in O(n), still has to move data; introsort
(std::sort) is O(n log n) per step. That is O(n²) or worse overall. Inserting at
the right place with a binary search (bisect.insort) finds the place in O(log n)
but still shifts O(n) elements: still O(n²).

Only the middle is needed, never the full order. Split the elements into a lower
half in a max-heap and an upper half in a min-heap, the lower one holding as many
elements or one more. The median is then the top of the lower heap. To insert x:
- push it onto the lower heap if x <= that top, else onto the upper heap;
- if the sizes are now off by more than that, move one top across.
Each step is a constant number of heap operations, O(log n), so O(n log n) in
total.

Python's heapq is a min-heap only: store negated values for the max-heap. C++:
std::priority_queue (a max-heap by default; std::greater<> makes a min-heap). Java:
PriorityQueue (a min-heap; Collections.reverseOrder() makes a max-heap).
"""
tests = [
  { in = [[5, 15, 1, 3]], out = [5, 5, 5, 3] },
  { in = [[]], out = [] },
  { in = [[2, 2, 2]], out = [2, 2, 2] },
  { in = [[3, 1, 2]], out = [3, 1, 2] },
  { in = [[-1, -2]], out = [-1, -2] },
  { in = [[1, 2, 3, 4, 5, 6]], out = [1, 1, 2, 2, 3, 3] },
]

[starter]
python = '''
def running_medians(nums: list[int]) -> list[int]:
    seen, out = [], []
    for x in nums:
        seen.append(x)
        seen.sort()
        out.append(seen[(len(seen) - 1) // 2])
    return out
'''
cpp = '''
#include <bits/stdc++.h>
using namespace std;


            vector<int> runningMedians(vector<int>& nums) {
                vector<int> seen, out;
                for (int x : nums) {
                    seen.push_back(x);
                    sort(seen.begin(), seen.end());
                    out.push_back(seen[(seen.size() - 1) / 2]);
                }
                return out;
            }
'''
java = '''
import java.util.*;


            class Solution {
                public int[] runningMedians(int[] nums) {
                    List<Integer> seen = new ArrayList<>();
                    int[] out = new int[nums.length];
                    for (int i = 0; i < nums.length; i++) {
                        seen.add(nums[i]);
                        Collections.sort(seen);
                        out[i] = seen.get((seen.size() - 1) / 2);
                    }
                    return out;
                }
            }
'''

[solutions]
python = '''
import heapq


def running_medians(nums: list[int]) -> list[int]:
    lower, upper = [], []  # lower: a max-heap of negated values
    out = []
    for x in nums:
        if not lower or x <= -lower[0]:
            heapq.heappush(lower, -x)
        else:
            heapq.heappush(upper, x)
        if len(lower) > len(upper) + 1:
            heapq.heappush(upper, -heapq.heappop(lower))
        elif len(upper) > len(lower):
            heapq.heappush(lower, -heapq.heappop(upper))
        out.append(-lower[0])
    return out
'''
cpp = '''
vector<int> runningMedians(vector<int>& nums) {
    priority_queue<int> lower;                             // max-heap
    priority_queue<int, vector<int>, greater<>> upper;     // min-heap
    vector<int> out;
    for (int x : nums) {
        if (lower.empty() || x <= lower.top()) lower.push(x);
        else upper.push(x);
        if (lower.size() > upper.size() + 1) {
            upper.push(lower.top());
            lower.pop();
        } else if (upper.size() > lower.size()) {
            lower.push(upper.top());
            upper.pop();
        }
        out.push_back(lower.top());
    }
    return out;
}
'''
java = '''
public int[] runningMedians(int[] nums) {
    PriorityQueue<Integer> lower = new PriorityQueue<>(Collections.reverseOrder());
    PriorityQueue<Integer> upper = new PriorityQueue<>();
    int[] out = new int[nums.length];
    for (int i = 0; i < nums.length; i++) {
        int x = nums[i];
        if (lower.isEmpty() || x <= lower.peek()) lower.add(x);
        else upper.add(x);
        if (lower.size() > upper.size() + 1) upper.add(lower.poll());
        else if (upper.size() > lower.size()) lower.add(upper.poll());
        out[i] = lower.peek();
    }
    return out;
}
'''

