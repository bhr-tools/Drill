title = "Counting ways to climb"
tags = ["optim", "dp", "memoization", "recursion"]
target = 480
signature = "count_ways(n: int, steps: list[int]) -> int"
complexity = "O(n)"
statement = """
A staircase has n stairs. Each move climbs one of the sizes in steps (distinct,
positive). count_ways(n, steps) is the number of move sequences reaching exactly
stair n, modulo 1 000 000 007.

The code you start with is correct, but too slow for the performance test.
1. Estimate its complexity, then press c to measure it.
2. Make it fast enough, and measure again.
"""
hint = "The recursion recomputes the same count_ways(i) again and again: compute each i once, from 0 up."
explanation = """
The recursion follows the definition: ways(n) = ways(n - s1) + ways(n - s2) + ...
But ways(n - 1) and ways(n - 2) both call ways(n - 3), and so on down: the same
subproblems are solved over and over. With steps [1, 2], the number of calls
grows like the Fibonacci numbers, about 1.618^n: exponential.

Yet there are only n + 1 distinct subproblems, one per stair. Solving each once
is dynamic programming:
- memoization keeps the recursion and caches results (functools.cache), but
  recursing n deep overflows the stack for large n (Python's limit is 1000);
- bottom-up, which this exercise needs, fills ways[0..n] from 0: ways[0] = 1, and
  ways[i] is the sum of ways[i - s] over the steps s <= i. That is O(n·k) for k
  steps, O(n) for a fixed set of steps, and needs no recursion.

Take the modulo at each addition, so values stay small; in C++ and Java, add in
long. Since ways[i] only needs the last max(steps) values, a small rolling buffer
cuts the memory to O(max step). For a fixed linear recurrence like this one,
matrix exponentiation even gets O(log n).
"""
tests = [
  { in = [4, [1, 2]], out = 5 },
  { in = [0, [1, 2]], out = 1 },
  { in = [3, [2]], out = 0 },
  { in = [10, [1, 2, 3]], out = 274 },
  { in = [5, [1, 3, 5]], out = 5 },
  { in = [30, [1, 2]], out = 1346269 },
]

[starter]
python = '''
def count_ways(n: int, steps: list[int]) -> int:
    if n == 0:
        return 1
    return sum(count_ways(n - s, steps) for s in steps if s <= n) % 1_000_000_007
'''
cpp = '''
#include <bits/stdc++.h>
using namespace std;


            int countWays(int n, vector<int>& steps) {
                if (n == 0) return 1;
                long long total = 0;
                for (int s : steps)
                    if (s <= n) total = (total + countWays(n - s, steps)) % 1'000'000'007;
                return total;
            }
'''
java = '''
import java.util.*;


            class Solution {
                public int countWays(int n, int[] steps) {
                    if (n == 0) return 1;
                    long total = 0;
                    for (int s : steps)
                        if (s <= n) total = (total + countWays(n - s, steps)) % 1_000_000_007;
                    return (int) total;
                }
            }
'''

[solutions]
python = '''
def count_ways(n: int, steps: list[int]) -> int:
    mod = 1_000_000_007
    ways = [1] + [0] * n
    for i in range(1, n + 1):
        ways[i] = sum(ways[i - s] for s in steps if s <= i) % mod
    return ways[n]
'''
cpp = '''
int countWays(int n, vector<int>& steps) {
    const long long mod = 1'000'000'007;
    vector<long long> ways(n + 1);
    ways[0] = 1;
    for (int i = 1; i <= n; ++i)
        for (int s : steps)
            if (s <= i) ways[i] = (ways[i] + ways[i - s]) % mod;
    return ways[n];
}
'''
java = '''
public int countWays(int n, int[] steps) {
    final long mod = 1_000_000_007;
    long[] ways = new long[n + 1];
    ways[0] = 1;
    for (int i = 1; i <= n; i++)
        for (int s : steps)
            if (s <= i) ways[i] = (ways[i] + ways[i - s]) % mod;
    return (int) ways[n];
}
'''

