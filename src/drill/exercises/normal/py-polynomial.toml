title = "Polynomial with operators"
kind = "code"
tags = ["python", "idiom", "dunder", "operators"]
target = 480
statement = """
Polynomial(coeffs) holds integer coefficients from the constant term up
(trailing zeros dropped): Polynomial([1, 2, 3]) is 1 + 2x + 3x².
- p(x) evaluates it; p.degree is a read-only property (-1 for the zero polynomial);
- p + q, p * q, and with an int on either side: 2 * p, p + 1, 1 + p;
- == compares coefficients (and is False against other types);
- repr(p) is "Polynomial([1, 2, 3])".
The coefficient list given to the constructor must not be modified.
"""
hint = "__call__ with Horner's rule, __add__/__radd__, __mul__/__rmul__, return NotImplemented for unknown types, @property, itertools.zip_longest(fillvalue=0)."

[starter]
python = '''
class Polynomial:
    def __init__(self, coeffs):
        pass
'''

[checks]
python = '''
p = Polynomial([1, 2, 3])
check("evaluate", p(2), 17)
check("degree", p.degree, 2)
check("zero polynomial degree", Polynomial([]).degree, -1)
check("trailing zeros dropped", Polynomial([1, 0, 0]), Polynomial([1]))
check("add", p + Polynomial([1, 1]), Polynomial([2, 3, 3]))
check("add down to zero", Polynomial([0, 1]) + Polynomial([0, -1]), Polynomial([]))
check("multiply", Polynomial([1, 1]) * Polynomial([1, 1]), Polynomial([1, 2, 1]))
check("int on the right", p * 2, Polynomial([2, 4, 6]))
check("int on the left", 2 * p, Polynomial([2, 4, 6]))
check("int + polynomial", 1 + p, Polynomial([2, 2, 3]))
check("repr", repr(Polynomial([1, 0, 2])), "Polynomial([1, 0, 2])")
check("not equal to other types", Polynomial([1]) == "x", False)
coeffs = [1, 0]
Polynomial(coeffs)
check("constructor input untouched", coeffs, [1, 0])
raises("degree is read-only", AttributeError, setattr, p, "degree", 5)
'''

[solutions]
python = '''
from itertools import zip_longest


class Polynomial:
    def __init__(self, coeffs):
        coeffs = list(coeffs)  # a copy: the caller's list stays as it was
        while coeffs and coeffs[-1] == 0:
            coeffs.pop()
        self.coeffs = coeffs

    @property
    def degree(self) -> int:
        return len(self.coeffs) - 1

    def __call__(self, x):
        result = 0
        for c in reversed(self.coeffs):
            result = result * x + c
        return result

    @staticmethod
    def _coerce(other):
        if isinstance(other, int):
            return Polynomial([other])
        return other if isinstance(other, Polynomial) else None

    def __add__(self, other):
        other = self._coerce(other)
        if other is None:
            return NotImplemented
        return Polynomial(a + b for a, b in zip_longest(self.coeffs, other.coeffs, fillvalue=0))

    __radd__ = __add__

    def __mul__(self, other):
        other = self._coerce(other)
        if other is None:
            return NotImplemented
        out = [0] * max(0, len(self.coeffs) + len(other.coeffs) - 1)
        for i, a in enumerate(self.coeffs):
            for j, b in enumerate(other.coeffs):
                out[i + j] += a * b
        return Polynomial(out)

    __rmul__ = __mul__

    def __eq__(self, other):
        if not isinstance(other, Polynomial):
            return NotImplemented
        return self.coeffs == other.coeffs

    def __repr__(self):
        return f"Polynomial({self.coeffs!r})"
'''
