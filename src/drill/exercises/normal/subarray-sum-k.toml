title = "Subarrays summing to k"
tags = ["prefix-sum", "hashmap"]
target = 360
signature = "subarray_sum(nums: list[int], k: int) -> int"
statement = """
Return how many contiguous non-empty subarrays of nums sum to exactly k.
nums may contain negative numbers, so a sliding window does not work. Aim for O(n).
"""
hint = "Running prefix sum p: every earlier prefix equal to p - k closes a valid subarray. Count prefixes in a hashmap."
complexity = "O(n)"
tests = [
  { in = [[1, 1, 1], 2], out = 2 },
  { in = [[1, 2, 3], 3], out = 2 },
  { in = [[1, -1, 0], 0], out = 3 },
  { in = [[3], 3], out = 1 },
  { in = [[1, 2, 1, 2, 1], 3], out = 4 },
  { in = [[0, 0, 0], 0], out = 6 },
  { in = [[-1, -1, 1], 0], out = 1 },
]

[solutions]
python = '''
from collections import defaultdict

def subarray_sum(nums: list[int], k: int) -> int:
    prefixes = defaultdict(int, {0: 1})
    total = count = 0
    for x in nums:
        total += x
        count += prefixes[total - k]
        prefixes[total] += 1
    return count
'''
cpp = '''
int subarraySum(vector<int>& nums, int k) {
    unordered_map<int, int> prefixes{{0, 1}};
    int total = 0, count = 0;
    for (int x : nums) {
        total += x;
        if (auto it = prefixes.find(total - k); it != prefixes.end()) count += it->second;
        ++prefixes[total];
    }
    return count;
}
'''
java = '''
public int subarraySum(int[] nums, int k) {
    Map<Integer, Integer> prefixes = new HashMap<>(Map.of(0, 1));
    int total = 0, count = 0;
    for (int x : nums) {
        total += x;
        count += prefixes.getOrDefault(total - k, 0);
        prefixes.merge(total, 1, Integer::sum);
    }
    return count;
}
'''

