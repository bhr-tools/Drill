title = "Records and comparator chains"
kind = "code"
tags = ["java", "idiom", "record", "comparator", "collectors"]
target = 420
statement = """
record Employee(String name, String team, int salary) is given. In class Payroll:
- ranked(staff): a new list sorted by team (ascending), then salary (highest
  first), then name (ascending). staff may be immutable;
- totalByTeam(staff): the salary total of each team, teams in ascending order;
- topEarner(staff): the best paid employee, if any.
"""
hint = "Comparator.comparing(Employee::team).thenComparing(Employee::salary, Comparator.reverseOrder()).thenComparing(Employee::name) — reversed() would reverse the whole chain. List.of(...).sort() throws."

[starter]
java = '''
import java.util.*;
import java.util.stream.*;

record Employee(String name, String team, int salary) {}

class Payroll {
    static List<Employee> ranked(List<Employee> staff) {
    }

    static Map<String, Integer> totalByTeam(List<Employee> staff) {
    }

    static Optional<Employee> topEarner(List<Employee> staff) {
    }
}
'''

[checks]
java = '''
List<Employee> staff = List.of(
    new Employee("Zoe", "ops", 50), new Employee("Adam", "dev", 70),
    new Employee("Bea", "dev", 90), new Employee("Carl", "dev", 70),
    new Employee("Dina", "ops", 65));
check("ranked", Payroll.ranked(staff).stream().map(Employee::name).toList(), List.of("Bea", "Adam", "Carl", "Dina", "Zoe"));
check("input untouched", staff.get(0).name(), "Zoe");
check("totals", Payroll.totalByTeam(staff), Map.of("dev", 230, "ops", 115));
check("teams in ascending order", new ArrayList<>(Payroll.totalByTeam(staff).keySet()), List.of("dev", "ops"));
check("top earner", Payroll.topEarner(staff).map(Employee::name), Optional.of("Bea"));
check("no one", Payroll.topEarner(List.of()), Optional.empty());
'''

[solutions]
java = '''
import java.util.*;
import java.util.stream.*;

record Employee(String name, String team, int salary) {}

class Payroll {
    static List<Employee> ranked(List<Employee> staff) {
        return staff.stream()
            .sorted(Comparator.comparing(Employee::team)
                .thenComparing(Employee::salary, Comparator.reverseOrder())
                .thenComparing(Employee::name))
            .toList();
    }

    static Map<String, Integer> totalByTeam(List<Employee> staff) {
        return staff.stream().collect(
            Collectors.groupingBy(Employee::team, TreeMap::new, Collectors.summingInt(Employee::salary)));
    }

    static Optional<Employee> topEarner(List<Employee> staff) {
        return staff.stream().max(Comparator.comparingInt(Employee::salary));
    }
}
'''
