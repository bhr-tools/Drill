    }
}
'''

[checks]
java = '''
Map<String, SortedSet<Integer>> idx = Index.build(List.of("The cat", "a dog", "the CAT sat"));
check("cat", idx.get("cat"), new TreeSet<>(List.of(1, 3)));
check("the", idx.get("the"), new TreeSet<>(List.of(1, 3)));
check("words in order", new ArrayList<>(idx.keySet()), List.of("a", "cat", "dog", "sat", "the"));
check("format", Index.format(idx), "a: 2\ncat: 1, 3\ndog: 2\nsat: 3\nthe: 1, 3");
check("blank lines", Index.build(List.of("", "  ")), Map.of());
check("punctuation", Index.build(List.of("dog, dog!")).get("dog"), new TreeSet<>(List.of(1)));
'''

[solutions]
java = '''
import java.util.*;
import java.util.stream.*;

class Index {
    static Map<String, SortedSet<Integer>> build(List<String> lines) {
        Map<String, SortedSet<Integer>> index = new TreeMap<>();
        for (int i = 0; i < lines.size(); i++)
            for (String word : lines.get(i).toLowerCase().split("[^a-z]+"))
                if (!word.isEmpty()) index.computeIfAbsent(word, w -> new TreeSet<>()).add(i + 1);
        return index;
    }

    static String format(Map<String, SortedSet<Integer>> index) {
        return index.entrySet().stream()
            .map(e -> e.getKey() + ": "
                + e.getValue().stream().map(String::valueOf).collect(Collectors.joining(", ")))
            .collect(Collectors.joining("\n"));
    }
}
'''
