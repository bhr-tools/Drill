title = "Word index"
kind = "code"
tags = ["java", "idiom", "collections", "treemap"]
target = 420
statement = """
In class Index:
- build(lines): maps each word (letters only, lowercased) to the sorted set of
  the line numbers (from 1) where it appears; words in alphabetical order;
- format(index): one "word: n1, n2" line per word, joined with newlines.
"""
hint = "TreeMap + computeIfAbsent(word, w -> new TreeSet<>()).add(line); Collectors.joining for format."

