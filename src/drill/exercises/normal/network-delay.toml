title = "Network delay"
tags = ["graph", "dijkstra", "heap"]
target = 600
signature = "network_delay(times: list[list[int]], n: int, k: int) -> int"
statement = """
A network has n nodes labelled 1..n. Each [u, v, w] in times is a directed
edge from u to v taking w units of time (w >= 0). A signal is sent from node k.
Return the time until every node has received it, or -1 if some never do.
"""
hint = "Dijkstra with a min-heap of (distance, node); the answer is the largest distance."
complexity = "O(n log n)"
tests = [
  { in = [[[2, 1, 1], [2, 3, 1], [3, 4, 1]], 4, 2], out = 2 },
  { in = [[[1, 2, 1]], 2, 1], out = 1 },
  { in = [[[1, 2, 1]], 2, 2], out = -1 },
  { in = [[], 1, 1], out = 0 },
  { in = [[[1, 2, 4], [1, 3, 1], [3, 2, 1], [2, 4, 1]], 4, 1], out = 3 },
  { in = [[[1, 2, 1], [2, 3, 2], [1, 3, 4]], 3, 1], out = 3 },
]

[solutions]
python = '''
import heapq

def network_delay(times: list[list[int]], n: int, k: int) -> int:
    graph = [[] for _ in range(n + 1)]
    for u, v, w in times:
        graph[u].append((v, w))
    dist = {}
    heap = [(0, k)]
    while heap:
        d, u = heapq.heappop(heap)
        if u in dist:
            continue
        dist[u] = d
        for v, w in graph[u]:
            if v not in dist:
                heapq.heappush(heap, (d + w, v))
    return max(dist.values()) if len(dist) == n else -1
'''
cpp = '''
int networkDelay(vector<vector<int>>& times, int n, int k) {
    vector<vector<pair<int, int>>> graph(n + 1);
    for (auto& t : times) graph[t[0]].push_back({t[1], t[2]});
    vector<int> dist(n + 1, INT_MAX);
    priority_queue<pair<int, int>, vector<pair<int, int>>, greater<>> heap;
    dist[k] = 0;
    heap.push({0, k});
    while (!heap.empty()) {
        auto [d, u] = heap.top();
        heap.pop();
        if (d > dist[u]) continue;
        for (auto [v, w] : graph[u])
            if (d + w < dist[v]) {
                dist[v] = d + w;
                heap.push({dist[v], v});
            }
    }
    int worst = *max_element(dist.begin() + 1, dist.end());
    return worst == INT_MAX ? -1 : worst;
}
'''
java = '''
public int networkDelay(int[][] times, int n, int k) {
    List<List<int[]>> graph = new ArrayList<>();
    for (int i = 0; i <= n; i++) graph.add(new ArrayList<>());
    for (int[] t : times) graph.get(t[0]).add(new int[]{t[1], t[2]});
    int[] dist = new int[n + 1];
    Arrays.fill(dist, Integer.MAX_VALUE);
    dist[k] = 0;
    PriorityQueue<int[]> heap = new PriorityQueue<>(Comparator.comparingInt(e -> e[0]));
    heap.add(new int[]{0, k});
    while (!heap.isEmpty()) {
        int[] top = heap.poll();
        int d = top[0], u = top[1];
        if (d > dist[u]) continue;
        for (int[] e : graph.get(u))
            if (d + e[1] < dist[e[0]]) {
                dist[e[0]] = d + e[1];
                heap.add(new int[]{dist[e[0]], e[0]});
            }
    }
    int worst = 0;
    for (int i = 1; i <= n; i++) worst = Math.max(worst, dist[i]);
    return worst == Integer.MAX_VALUE ? -1 : worst;
}
'''

