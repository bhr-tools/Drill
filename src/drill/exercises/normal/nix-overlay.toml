title = "Overlays: final and prev"
kind = "code"
file = "overlay.nix"
tags = ["nix", "overlays", "nixpkgs", "fixpoint"]
target = 360
statement = """
Write overlay.nix, an overlay (final: prev: { … }) that adds two packages:
- hello-drill: GNU hello with pname "hello-drill" and its test suite disabled
  (doCheck = false), through overrideAttrs; same version as hello.
- greeting: a script, made with writeShellScriptBin, that runs hello-drill with
  -g "Salut".
Try it: nix repl, then pkgs = import <nixpkgs> { overlays = [ (import ./overlay.nix) ]; }
"""
hint = "hello-drill = prev.hello.overrideAttrs (old: { … }); greeting = final.writeShellScriptBin \"greeting\" ''${final.hello-drill}/bin/hello -g Salut'';"
explanation = """
An overlay is a function of two package sets: prev, the set before this overlay,
and final, the set after every overlay has been applied (a fixed point). Take
what you modify from prev (prev.hello, to avoid an infinite recursion), and what
you depend on from final, so that a later overlay that changes hello-drill is
seen by greeting too.

overrideAttrs changes the arguments of mkDerivation (pname, doCheck, patches…);
override, on the other hand, changes the arguments of the package's function
(its dependencies and feature flags).
"""

[starter]
nix = '''
final: prev: {
}
'''

[setup]
nix = '''
extended = import nixpkgs { inherit system; overlays = [ (import file) ]; };
'''

[checks]
nix = '''
(check "hello-drill exists" (extended ? hello-drill) true)
(check "its pname" (extended.hello-drill.pname or null) "hello-drill")
(check "same version as hello" (extended.hello-drill.version or null) pkgs.hello.version)
(check "tests disabled" (extended.hello-drill.doCheck or null) false)
(check "hello itself is unchanged" extended.hello.pname "hello")
(check "greeting is named greeting" (extended.greeting.name or null) "greeting")
(check "greeting runs hello-drill" (contains "${extended.hello-drill}/bin/hello" (extended.greeting.text or "")) true)
(check "with -g Salut" (lib.hasInfix "Salut" (extended.greeting.text or "")) true)
'''

[solutions]
nix = '''
final: prev: {
  hello-drill = prev.hello.overrideAttrs (old: {
    pname = "hello-drill";
    doCheck = false;
  });

  greeting = final.writeShellScriptBin "greeting" ''
    exec ${final.hello-drill}/bin/hello -g "Salut"
  '';
}
'''

[[variants]]
statement = """
Write overlay.nix, an overlay (final: prev: { … }) that:
- replaces hello by GNU hello with pname "hello-custom" (overrideAttrs);
- keeps the original as hello-original;
- adds hello-wrapper, a script (writeShellScriptBin) that execs the hello of the
  final package set, so the custom one, with "$@".
Try it: nix repl, then pkgs = import <nixpkgs> { overlays = [ (import ./overlay.nix) ]; }
"""
hint = "hello = prev.hello.overrideAttrs …; hello-original = prev.hello; and ${final.hello} in the wrapper."
[variants.checks]
nix = '''
(check "hello is replaced" (extended.hello.pname or null) "hello-custom")
(check "hello-original is GNU hello" (extended.hello-original.pname or null) "hello")
(check "two different packages" (extended.hello.outPath != (extended.hello-original.outPath or "")) true)
(check "the wrapper is named hello-wrapper" (extended.hello-wrapper.name or null) "hello-wrapper")
(check "the wrapper runs the custom hello" (contains "${extended.hello}/bin/hello" (extended.hello-wrapper.text or "")) true)
(check "with its arguments" (lib.hasInfix "\"$@\"" (extended.hello-wrapper.text or "")) true)
'''
[variants.solutions]
nix = '''
final: prev: {
  hello = prev.hello.overrideAttrs (old: { pname = "hello-custom"; });
  hello-original = prev.hello;
  hello-wrapper = final.writeShellScriptBin "hello-wrapper" ''
    exec ${final.hello}/bin/hello "$@"
  '';
}
'''
