title = "Merge intervals"
tags = ["sorting", "intervals"]
target = 360
signature = "merge_intervals(intervals: list[list[int]]) -> list[list[int]]"
statement = """
Each interval is [start, end] with start <= end. Merge all overlapping
intervals (touching ones like [1, 4] and [4, 5] overlap too) and return the
result sorted by start.
"""
hint = "Sort by start; extend the last merged interval while the next one starts before its end."
complexity = "O(n log n)"
tests = [
  { in = [[[1, 3], [2, 6], [8, 10], [15, 18]]], out = [[1, 6], [8, 10], [15, 18]] },
  { in = [[[1, 4], [4, 5]]], out = [[1, 5]] },
  { in = [[[1, 4], [0, 4]]], out = [[0, 4]] },
  { in = [[[1, 4], [2, 3]]], out = [[1, 4]] },
  { in = [[]], out = [] },
  { in = [[[5, 6], [1, 2], [3, 4]]], out = [[1, 2], [3, 4], [5, 6]] },
  { in = [[[2, 3], [4, 5], [6, 7], [8, 9], [1, 10]]], out = [[1, 10]] },
]

[solutions]
python = '''
def merge_intervals(intervals: list[list[int]]) -> list[list[int]]:
    merged = []
    for start, end in sorted(intervals):
        if merged and start <= merged[-1][1]:
            merged[-1][1] = max(merged[-1][1], end)
        else:
            merged.append([start, end])
    return merged
'''
cpp = '''
vector<vector<int>> mergeIntervals(vector<vector<int>>& intervals) {
    sort(intervals.begin(), intervals.end());
    vector<vector<int>> merged;
    for (auto& iv : intervals) {
        if (!merged.empty() && iv[0] <= merged.back()[1])
            merged.back()[1] = max(merged.back()[1], iv[1]);
        else
            merged.push_back(iv);
    }
    return merged;
}
'''
java = '''
public int[][] mergeIntervals(int[][] intervals) {
    Arrays.sort(intervals, Comparator.comparingInt(iv -> iv[0]));
    List<int[]> merged = new ArrayList<>();
    for (int[] iv : intervals) {
        int[] last = merged.isEmpty() ? null : merged.get(merged.size() - 1);
        if (last != null && iv[0] <= last[1]) last[1] = Math.max(last[1], iv[1]);
        else merged.add(new int[]{iv[0], iv[1]});
    }
    return merged.toArray(new int[0][]);
}
'''

