title = "Maps and sets from functors"
kind = "code"
tags = ["ocaml", "idiom", "functor", "map"]
target = 360
statement = """
Define module SMap = Map.Make (String), then:
- count_words words: the number of occurrences of each word, an int SMap.t
  (SMap.update with an option is the idiom).
- most_frequent counts: Some (word, count) with the highest count, the smallest
  word on ties; None for an empty map.
- to_assoc counts: the bindings as a sorted association list.
"""
hint = "SMap.update w (function None -> Some 1 | Some n -> Some (n + 1)); SMap.fold for most_frequent."
explanation = """
Map.Make is a functor: a function from modules to modules. Given a module with a
type t and a compare function, it returns a module of immutable balanced trees
keyed by t. Updates return a new map sharing most of its nodes with the old one,
in O(log n).

SMap.bindings already returns the pairs sorted by key, and SMap.fold visits the
keys in increasing order: on a tie, keeping the current best (strictly greater
counts only) gives the smallest word.
"""

[starter]
ocaml = '''
module SMap = Map.Make (String)

let count_words (words : string list) : int SMap.t = failwith "todo"

let most_frequent (counts : int SMap.t) : (string * int) option = failwith "todo"

let to_assoc (counts : int SMap.t) : (string * int) list = failwith "todo"
'''

[checks]
ocaml = '''
let counts = count_words [ "b"; "a"; "b"; "c"; "a"; "b" ] in
check_eq ~show:Show.int "b" (SMap.find "b" counts) 3;
check_eq ~show:Show.int "a" (SMap.find "a" counts) 2;
check "missing" (not (SMap.mem "z" counts));
let show = Show.(list (pair string int)) in
check_eq ~show "to_assoc" (to_assoc counts) [ ("a", 2); ("b", 3); ("c", 1) ];
check_eq ~show "empty" (to_assoc (count_words [])) [];
let show = Show.(option (pair string int)) in
check_eq ~show "most frequent" (most_frequent counts) (Some ("b", 3));
check_eq ~show "tie" (most_frequent (count_words [ "y"; "x"; "y"; "x" ])) (Some ("x", 2));
check_eq ~show "none" (most_frequent SMap.empty) None;
'''

[solutions]
ocaml = '''
module SMap = Map.Make (String)

let count_words words =
  List.fold_left
    (fun m w -> SMap.update w (function None -> Some 1 | Some n -> Some (n + 1)) m)
    SMap.empty words

let most_frequent counts =
  SMap.fold
    (fun w n best ->
      match best with Some (_, m) when m >= n -> best | _ -> Some (w, n))
    counts None

let to_assoc = SMap.bindings
'''

[[variants]]
title = "Sets from a functor"
statement = """
Define module ISet = Set.Make (Int), then:
- unique_sorted xs: the distinct values of xs, sorted (through a set).
- common a b: the values present in both lists, sorted.
- missing ~upto xs: the values of 1..upto absent from xs, sorted.
"""
hint = "ISet.of_list, ISet.inter, ISet.diff, ISet.elements (sorted)."
explanation = """
Set.Make builds a module of immutable balanced trees: of_list is O(n log n),
inter and diff are linear-ish merges of two trees, and elements returns the
values in increasing order, which is why no sort is needed.
"""
[variants.starter]
ocaml = '''
module ISet = Set.Make (Int)

let unique_sorted (xs : int list) : int list = failwith "todo"

let common (a : int list) (b : int list) : int list = failwith "todo"

let missing ~(upto : int) (xs : int list) : int list = failwith "todo"
'''
[variants.checks]
ocaml = '''
let show = Show.(list int) in
check_eq ~show "unique" (unique_sorted [ 3; 1; 3; 2; 1 ]) [ 1; 2; 3 ];
check_eq ~show "unique empty" (unique_sorted []) [];
check_eq ~show "common" (common [ 5; 1; 3; 3 ] [ 3; 4; 5 ]) [ 3; 5 ];
check_eq ~show "nothing common" (common [ 1 ] [ 2 ]) [];
check_eq ~show "missing" (missing ~upto:6 [ 2; 4; 4; 9 ]) [ 1; 3; 5; 6 ];
check_eq ~show "none missing" (missing ~upto:2 [ 1; 2 ]) [];
check "a set module" (ISet.cardinal (ISet.of_list [ 1; 1; 2 ]) = 2);
'''
[variants.solutions]
ocaml = '''
module ISet = Set.Make (Int)

let unique_sorted xs = ISet.elements (ISet.of_list xs)

let common a b = ISet.elements (ISet.inter (ISet.of_list a) (ISet.of_list b))

let missing ~upto xs = ISet.elements (ISet.diff (ISet.of_list (List.init upto succ)) (ISet.of_list xs))
'''
