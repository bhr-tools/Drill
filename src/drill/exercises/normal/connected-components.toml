title = "Connected components"
tags = ["graph", "union-find"]
target = 360
signature = "count_components(n: int, edges: list[list[int]]) -> int"
statement = """
An undirected graph has n nodes numbered 0..n-1 and the given edges.
Return its number of connected components. Drill the union-find version.
"""
hint = "Union-find: start with n components, and each union of two different roots removes one."
complexity = "O(n)"
tests = [
  { in = [5, [[0, 1], [1, 2], [3, 4]]], out = 2 },
  { in = [5, [[0, 1], [1, 2], [2, 3], [3, 4]]], out = 1 },
  { in = [3, []], out = 3 },
  { in = [1, []], out = 1 },
  { in = [4, [[0, 1], [2, 3], [1, 0]]], out = 2 },
  { in = [6, [[0, 1], [1, 2], [2, 0], [3, 4]]], out = 3 },
]

[solutions]
python = '''
def count_components(n: int, edges: list[list[int]]) -> int:
    parent = list(range(n))

    def find(x: int) -> int:
        while parent[x] != x:
            parent[x] = parent[parent[x]]
            x = parent[x]
        return x

    components = n
    for a, b in edges:
        ra, rb = find(a), find(b)
        if ra != rb:
            parent[ra] = rb
            components -= 1
    return components
'''
cpp = '''
int countComponents(int n, vector<vector<int>>& edges) {
    vector<int> parent(n);
    iota(parent.begin(), parent.end(), 0);
    auto find = [&](int x) {
        while (parent[x] != x) x = parent[x] = parent[parent[x]];
        return x;
    };
    int components = n;
    for (auto& e : edges) {
        int ra = find(e[0]), rb = find(e[1]);
        if (ra != rb) {
            parent[ra] = rb;
            --components;
        }
    }
    return components;
}
'''
java = '''
private int[] parent;

private int find(int x) {
    while (parent[x] != x) x = parent[x] = parent[parent[x]];
    return x;
}

public int countComponents(int n, int[][] edges) {
    parent = new int[n];
    for (int i = 0; i < n; i++) parent[i] = i;
    int components = n;
    for (int[] e : edges) {
        int ra = find(e[0]), rb = find(e[1]);
        if (ra != rb) {
            parent[ra] = rb;
            components--;
        }
    }
    return components;
}
'''

