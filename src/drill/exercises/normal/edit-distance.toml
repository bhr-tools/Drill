title = "Edit distance"
tags = ["dp", "string"]
target = 600
signature = "edit_distance(a: str, b: str) -> int"
statement = """
Return the minimum number of single-character insertions, deletions and
substitutions needed to turn a into b.
"""
hint = "dp[i][j] for prefixes a[:i], b[:j]; equal chars cost nothing, else 1 + min of the three neighbours."
complexity = "O(n²)"
tests = [
  { in = ["horse", "ros"], out = 3 },
  { in = ["intention", "execution"], out = 5 },
  { in = ["", ""], out = 0 },
  { in = ["", "abc"], out = 3 },
  { in = ["abc", "abc"], out = 0 },
  { in = ["kitten", "sitting"], out = 3 },
  { in = ["a", "b"], out = 1 },
]

[solutions]
python = '''
def edit_distance(a: str, b: str) -> int:
    prev = list(range(len(b) + 1))
    for i, ca in enumerate(a, 1):
        cur = [i] + [0] * len(b)
        for j, cb in enumerate(b, 1):
            if ca == cb:
                cur[j] = prev[j - 1]
            else:
                cur[j] = 1 + min(prev[j - 1], prev[j], cur[j - 1])
        prev = cur
    return prev[-1]
'''
cpp = '''
int editDistance(const string& a, const string& b) {
    int n = a.size(), m = b.size();
    vector<vector<int>> dp(n + 1, vector<int>(m + 1));
    for (int i = 0; i <= n; ++i) dp[i][0] = i;
    for (int j = 0; j <= m; ++j) dp[0][j] = j;
    for (int i = 1; i <= n; ++i)
        for (int j = 1; j <= m; ++j)
            dp[i][j] = a[i - 1] == b[j - 1]
                ? dp[i - 1][j - 1]
                : 1 + min({dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]});
    return dp[n][m];
}
'''
java = '''
public int editDistance(String a, String b) {
    int n = a.length(), m = b.length();
    int[][] dp = new int[n + 1][m + 1];
    for (int i = 0; i <= n; i++) dp[i][0] = i;
    for (int j = 0; j <= m; j++) dp[0][j] = j;
    for (int i = 1; i <= n; i++)
        for (int j = 1; j <= m; j++)
            dp[i][j] = a.charAt(i - 1) == b.charAt(j - 1)
                ? dp[i - 1][j - 1]
                : 1 + Math.min(dp[i - 1][j - 1], Math.min(dp[i - 1][j], dp[i][j - 1]));
    return dp[n][m];
}
'''

