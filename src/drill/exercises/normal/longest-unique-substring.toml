title = "Longest substring without repeats"
tags = ["sliding-window", "hashmap"]
target = 300
signature = "longest_unique_substring(s: str) -> int"
statement = """
Return the length of the longest substring of s in which no character appears
twice. Aim for O(n).
"""
hint = "Sliding window: remember the last index of each character; jump the left edge past it."
complexity = "O(n)"
tests = [
  { in = ["abcabcbb"], out = 3 },
  { in = ["bbbbb"], out = 1 },
  { in = ["pwwkew"], out = 3 },
  { in = [""], out = 0 },
  { in = [" "], out = 1 },
  { in = ["dvdf"], out = 3 },
  { in = ["abba"], out = 2 },
  { in = ["tmmzuxt"], out = 5 },
]

[solutions]
python = '''
def longest_unique_substring(s: str) -> int:
    last = {}
    best = left = 0
    for i, c in enumerate(s):
        if last.get(c, -1) >= left:
            left = last[c] + 1
        last[c] = i
        best = max(best, i - left + 1)
    return best
'''
cpp = '''
int longestUniqueSubstring(const string& s) {
    vector<int> last(256, -1);
    int best = 0, left = 0;
    for (int i = 0; i < (int)s.size(); ++i) {
        unsigned char c = s[i];
        if (last[c] >= left) left = last[c] + 1;
        last[c] = i;
        best = max(best, i - left + 1);
    }
    return best;
}
'''
java = '''
public int longestUniqueSubstring(String s) {
    Map<Character, Integer> last = new HashMap<>();
    int best = 0, left = 0;
    for (int i = 0; i < s.length(); i++) {
        char c = s.charAt(i);
        if (last.getOrDefault(c, -1) >= left) left = last.get(c) + 1;
        last.put(c, i);
        best = Math.max(best, i - left + 1);
    }
    return best;
}
'''

