title = "Strings and interpolation"
tags = ["nix", "idiom", "strings", "lib"]
target = 90
signature = "env_file(vars: any) -> str"
statement = """
Render vars as an environment file: one NAME=value line per attribute, in name
order, each line ending with a newline. Values are strings or integers.
"""
hint = "lib.concatStrings (lib.mapAttrsToList (name: value: \"${name}=${toString value}\\n\") vars)"
tests = [
  { in = [{ PORT = 8080, HOST = "localhost" }], out = "HOST=localhost\nPORT=8080\n" },
  { in = [{}], out = "" },
  { in = [{ A = "" }], out = "A=\n" },
  { in = [{ X = "a b" }], out = "X=a b\n" },
  { in = [{ b = 2, a = 1 }], out = "a=1\nb=2\n" },
]

[solutions]
nix = '''
vars: lib.concatStrings (lib.mapAttrsToList (name: value: "${name}=${toString value}\n") vars)
'''

[[variants]]
signature = "major_minor(versions: list[str]) -> list[str]"
statement = """
The major.minor part of each version: "1.24.3" gives "1.24", "2.0" stays "2.0".
"""
hint = "lib.versions.majorMinor, or builtins.splitVersion."
tests = [
  { in = [["1.24.3", "2.0"]], out = ["1.24", "2.0"] },
  { in = [[]], out = [] },
  { in = [["10.11.12.13"]], out = ["10.11"] },
  { in = [["3.12.1"]], out = ["3.12"] },
  { in = [["0.1.0", "6.6.30"]], out = ["0.1", "6.6"] },
]
[variants.solutions]
nix = '''
versions: map lib.versions.majorMinor versions
'''

[[variants]]
signature = "command_line(program: str, args: list[str]) -> str"
statement = """
A shell command line running program with args, as in a systemd ExecStart or a
script: every word quoted for the shell when it needs to be, the program too.
Do not write the quoting yourself.
"""
hint = "lib.escapeShellArgs, on the program followed by its arguments."
tests = [
  { in = ["echo", ["hello", "world"]], out = "echo hello world" },
  { in = ["ls", []], out = "ls" },
  { in = ["echo", ["a b"]], out = "echo 'a b'" },
  { in = ["printf", ["%s\n", "x"]], out = "printf '%s\n' x" },
  { in = ["echo", ["it's"]], out = "echo 'it'\\''s'" },
]
[variants.solutions]
nix = '''
program: args: lib.escapeShellArgs ([ program ] ++ args)
'''
