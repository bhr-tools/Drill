title = "Two sum"
tags = ["hashmap"]
target = 90
signature = "two_sum(nums: list[int], target: int) -> list[int]"
statement = """
Return the indices [i, j], with i < j, of the two numbers of nums that add up
to target. There is exactly one answer. Aim for a single pass.
"""
hint = "Remember each value's index in a hashmap; look up target - x before inserting x."
complexity = "O(n)"
tests = [
  { in = [[2, 7, 11, 15], 9], out = [0, 1] },
  { in = [[3, 2, 4], 6], out = [1, 2] },
  { in = [[3, 3], 6], out = [0, 1] },
  { in = [[-1, -2, -3, -4, -5], -8], out = [2, 4] },
  { in = [[0, 4, 3, 0], 0], out = [0, 3] },
  { in = [[1, 5, 9, 13, 2], 15], out = [3, 4] },
]

[solutions]
python = '''
def two_sum(nums: list[int], target: int) -> list[int]:
    seen = {}
    for j, x in enumerate(nums):
        if target - x in seen:
            return [seen[target - x], j]
        seen[x] = j
    return []
'''
cpp = '''
vector<int> twoSum(vector<int>& nums, int target) {
    unordered_map<int, int> seen;
    for (int j = 0; j < (int)nums.size(); ++j) {
        auto it = seen.find(target - nums[j]);
        if (it != seen.end()) return {it->second, j};
        seen[nums[j]] = j;
    }
    return {};
}
'''
java = '''
public int[] twoSum(int[] nums, int target) {
    Map<Integer, Integer> seen = new HashMap<>();
    for (int j = 0; j < nums.length; j++) {
        Integer i = seen.get(target - nums[j]);
        if (i != null) return new int[]{i, j};
        seen.put(nums[j], j);
    }
    return new int[0];
}
'''

[[perf]]
label = "n = 300 000, the pair at the very end"
code = '''
nums = [2 * x for x in rng.sample(range(-10**8, 10**8), 300_000)]
nums[-2] += 1  # the only odd value, so exactly one pair sums to the odd target
args = [nums, nums[-2] + nums[-1]]
'''

[scale]
label = "n = len(nums)"
code = '''
nums = [2 * x for x in rng.sample(range(-10**8, 10**8), n)]
nums[-2] += 1  # the only odd value: the single answer is the last pair
args = [nums, nums[-2] + nums[-1]]
'''

[[variants]]
title = "Pair with a difference"
signature = "pair_with_difference(nums: list[int], k: int) -> list[int]"
statement = """
Return the indices [i, j], with i < j, such that nums[j] - nums[i] == k. There
is exactly one such pair. In one pass.
"""
hint = "For each j, look up nums[j] - k among the values already seen (value -> index)."
tests = [
  { in = [[1, 5, 3, 4], 2], out = [0, 2] },
  { in = [[10, 4], -6], out = [0, 1] },
  { in = [[0, 0], 0], out = [0, 1] },
  { in = [[8, 1, 10, 2], 1], out = [1, 3] },
  { in = [[-3, 6, 2], 5], out = [0, 2] },
]
[variants.solutions]
python = '''
def pair_with_difference(nums, k):
    seen = {}
    for j, x in enumerate(nums):
        if x - k in seen:
            return [seen[x - k], j]
        seen.setdefault(x, j)
    return []
'''
cpp = '''
vector<int> pairWithDifference(vector<int>& nums, int k) {
    unordered_map<int, int> seen;
    for (int j = 0; j < (int)nums.size(); ++j) {
        if (auto it = seen.find(nums[j] - k); it != seen.end()) return {it->second, j};
        seen.try_emplace(nums[j], j);
    }
    return {};
}
'''
java = '''
public int[] pairWithDifference(int[] nums, int k) {
    Map<Integer, Integer> seen = new HashMap<>();
    for (int j = 0; j < nums.length; j++) {
        Integer i = seen.get(nums[j] - k);
        if (i != null) return new int[]{i, j};
        seen.putIfAbsent(nums[j], j);
    }
    return new int[0];
}
'''

[[variants]]
title = "Count the pairs"
signature = "count_pairs(nums: list[int], target: int) -> long"
statement = """
How many pairs of indices i < j have nums[i] + nums[j] == target? In one pass:
the answer can exceed 2^31.
"""
hint = "Count the values seen so far; each x adds the count of target - x."
tests = [
  { in = [[1, 5, 7, -1, 5], 6], out = 3 },
  { in = [[1, 1, 1, 1], 2], out = 6 },
  { in = [[], 0], out = 0 },
  { in = [[3], 6], out = 0 },
  { in = [[2, 4, 3, 3], 6], out = 2 },
]
[variants.solutions]
python = '''
from collections import Counter

def count_pairs(nums, target):
    seen, pairs = Counter(), 0
    for x in nums:
        pairs += seen[target - x]
        seen[x] += 1
    return pairs
'''
cpp = '''
long long countPairs(vector<int>& nums, int target) {
    unordered_map<long long, long long> seen;
    long long pairs = 0;
    for (int x : nums) {
        if (auto it = seen.find((long long)target - x); it != seen.end()) pairs += it->second;
        ++seen[x];
    }
    return pairs;
}
'''
java = '''
public long countPairs(int[] nums, int target) {
    Map<Integer, Long> seen = new HashMap<>();
    long pairs = 0;
    for (int x : nums) {
        pairs += seen.getOrDefault(target - x, 0L);
        seen.merge(x, 1L, Long::sum);
    }
    return pairs;
}
'''
