title = "Rotate a matrix"
tags = ["matrix"]
target = 120
signature = "rotate_matrix(matrix: list[list[int]]) -> list[list[int]]"
statement = """
matrix has rows × cols elements (non-empty). Return the cols × rows matrix
obtained by rotating it 90° clockwise.
"""
hint = "Element (i, j) moves to (j, rows - 1 - i)."
tests = [
  { in = [[[1, 2, 3], [4, 5, 6], [7, 8, 9]]], out = [[7, 4, 1], [8, 5, 2], [9, 6, 3]] },
  { in = [[[1]]], out = [[1]] },
  { in = [[[1, 2], [3, 4]]], out = [[3, 1], [4, 2]] },
  { in = [[[1, 2, 3], [4, 5, 6]]], out = [[4, 1], [5, 2], [6, 3]] },
  { in = [[[5, 1, 9, 11], [2, 4, 8, 10], [13, 3, 6, 7], [15, 14, 12, 16]]], out = [[15, 13, 2, 5], [14, 3, 4, 1], [12, 6, 8, 9], [16, 7, 10, 11]] },
]

[solutions]
python = '''
def rotate_matrix(matrix: list[list[int]]) -> list[list[int]]:
    return [list(row) for row in zip(*matrix[::-1])]
'''
cpp = '''
vector<vector<int>> rotateMatrix(vector<vector<int>>& matrix) {
    int rows = matrix.size(), cols = matrix[0].size();
    vector<vector<int>> out(cols, vector<int>(rows));
    for (int i = 0; i < rows; ++i)
        for (int j = 0; j < cols; ++j)
            out[j][rows - 1 - i] = matrix[i][j];
    return out;
}
'''
java = '''
public int[][] rotateMatrix(int[][] matrix) {
    int rows = matrix.length, cols = matrix[0].length;
    int[][] out = new int[cols][rows];
    for (int i = 0; i < rows; i++)
        for (int j = 0; j < cols; j++)
            out[j][rows - 1 - i] = matrix[i][j];
    return out;
}
'''

