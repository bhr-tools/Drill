title = "Move zeros"
tags = ["two-pointers", "array"]
target = 75
signature = "move_zeros(nums: list[int]) -> list[int]"
statement = """
Move every 0 of nums to the end while keeping the relative order of the other
elements, then return nums. Do it in place, in one pass plus a fill.
"""
hint = "A write index for the next non-zero element; fill the rest with zeros."
complexity = "O(n)"
tests = [
  { in = [[0, 1, 0, 3, 12]], out = [1, 3, 12, 0, 0] },
  { in = [[0]], out = [0] },
  { in = [[1, 2]], out = [1, 2] },
  { in = [[0, 0, 1]], out = [1, 0, 0] },
  { in = [[]], out = [] },
  { in = [[4, 0, -2, 0, 0, 7]], out = [4, -2, 7, 0, 0, 0] },
]

[solutions]
python = '''
def move_zeros(nums: list[int]) -> list[int]:
    write = 0
    for x in nums:
        if x != 0:
            nums[write] = x
            write += 1
    nums[write:] = [0] * (len(nums) - write)
    return nums
'''
cpp = '''
vector<int> moveZeros(vector<int>& nums) {
    stable_partition(nums.begin(), nums.end(), [](int x) { return x != 0; });
    return nums;
}
'''
java = '''
public int[] moveZeros(int[] nums) {
    int write = 0;
    for (int x : nums)
        if (x != 0) nums[write++] = x;
    Arrays.fill(nums, write, nums.length, 0);
    return nums;
}
'''

[[perf]]
label = "n = 200 000, half zeros"
in = "[[rng.choice((0, rng.randint(1, 9))) for _ in range(200_000)]]"

[scale]
label = "n = len(nums)"
in = "[[rng.choice((0, rng.randint(1, 9))) for _ in range(n)]]"
