title = "Maximum subarray"
tags = ["dp", "array"]
target = 90
signature = "max_subarray(nums: list[int]) -> int"
statement = """
Return the largest sum of a non-empty contiguous subarray of nums, in O(n).
"""
hint = "Kadane: the best sum ending here is max(x, best ending at previous + x)."
complexity = "O(n)"
tests = [
  { in = [[-2, 1, -3, 4, -1, 2, 1, -5, 4]], out = 6 },
  { in = [[1]], out = 1 },
  { in = [[5, 4, -1, 7, 8]], out = 23 },
  { in = [[-3, -1, -2]], out = -1 },
  { in = [[2, -1, 2]], out = 3 },
  { in = [[0, 0]], out = 0 },
]

[solutions]
ocaml = '''
let max_subarray = function
  | [] -> 0
  | x :: xs ->
      let _, best =
        List.fold_left
          (fun (here, best) y -> let here = max y (here + y) in (here, max best here))
          (x, x) xs
      in
      best
'''
python = '''
def max_subarray(nums: list[int]) -> int:
    best = current = nums[0]
    for x in nums[1:]:
        current = max(x, current + x)
        best = max(best, current)
    return best
'''
cpp = '''
int maxSubarray(vector<int>& nums) {
    int best = nums[0], current = 0;
    for (int x : nums) {
        current = max(x, current + x);
        best = max(best, current);
    }
    return best;
}
'''
java = '''
public int maxSubarray(int[] nums) {
    int best = nums[0], current = 0;
    for (int x : nums) {
        current = Math.max(x, current + x);
        best = Math.max(best, current);
    }
    return best;
}
'''

[[perf]]
label = "n = 200 000"
in = "[[rng.randint(-10_000, 10_000) for _ in range(200_000)]]"

[scale]
label = "n = len(nums)"
in = "[[rng.randint(-10_000, 10_000) for _ in range(n)]]"
