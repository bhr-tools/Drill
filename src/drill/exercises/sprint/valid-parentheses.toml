title = "Valid parentheses"
tags = ["stack"]
target = 90
signature = "valid_parentheses(s: str) -> bool"
statement = """
s contains only the characters ()[]{}. Is every bracket closed by the matching
bracket, in the correct order?
"""
hint = "Push the expected closing bracket; on a closing bracket, it must match the top of the stack."
complexity = "O(n)"
tests = [
  { in = ["()"], out = true },
  { in = ["()[]{}"], out = true },
  { in = ["(]"], out = false },
  { in = ["([)]"], out = false },
  { in = ["{[]}"], out = true },
  { in = [""], out = true },
  { in = ["(("], out = false },
  { in = ["))"], out = false },
]

[solutions]
ocaml = '''
let valid_parentheses s =
  let closing = function '(' -> Some ')' | '[' -> Some ']' | '{' -> Some '}' | _ -> None in
  let rec go i stack =
    if i = String.length s then stack = []
    else
      match closing s.[i], stack with
      | Some c, _ -> go (i + 1) (c :: stack)
      | None, top :: rest when top = s.[i] -> go (i + 1) rest
      | None, _ -> false
  in
  go 0 []
'''
python = '''
def valid_parentheses(s: str) -> bool:
    opening = {")": "(", "]": "[", "}": "{"}
    stack = []
    for c in s:
        if c not in opening:
            stack.append(c)
        elif not stack or stack.pop() != opening[c]:
            return False
    return not stack
'''
cpp = '''
bool validParentheses(const string& s) {
    string stack;
    for (char c : s) {
        if (c == '(') stack += ')';
        else if (c == '[') stack += ']';
        else if (c == '{') stack += '}';
        else if (stack.empty() || stack.back() != c) return false;
        else stack.pop_back();
    }
    return stack.empty();
}
'''
java = '''
public boolean validParentheses(String s) {
    Deque<Character> stack = new ArrayDeque<>();
    for (char c : s.toCharArray()) {
        switch (c) {
            case '(' -> stack.push(')');
            case '[' -> stack.push(']');
            case '{' -> stack.push('}');
            default -> {
                if (stack.isEmpty() || stack.pop() != c) return false;
            }
        }
    }
    return stack.isEmpty();
}
'''

[[perf]]
label = "n = 200 000, deeply nested"
in = "['(' * 50_000 + '[{' * 25_000 + '}]' * 25_000 + ')' * 50_000]"

[scale]
label = "n = len(s)"
in = "['(' * (n // 2) + ')' * (n // 2)]"

[[variants]]
title = "Make the parentheses valid"
signature = "min_additions(s: str) -> int"
statement = """
s contains only '(' and ')'. Return the smallest number of parentheses to
insert anywhere in s to make it valid (every '(' closed in order).
"""
hint = "A counter of open parentheses; a ')' with none open needs one more '('."
tests = [
  { in = ["())"], out = 1 },
  { in = ["((("], out = 3 },
  { in = ["()"], out = 0 },
  { in = [""], out = 0 },
  { in = ["()))(("], out = 4 },
  { in = [")("], out = 2 },
]
[variants.solutions]
python = '''
def min_additions(s):
    open_, added = 0, 0
    for c in s:
        if c == "(":
            open_ += 1
        elif open_:
            open_ -= 1
        else:
            added += 1
    return added + open_
'''
cpp = '''
int minAdditions(const string& s) {
    int open = 0, added = 0;
    for (char c : s) {
        if (c == '(') ++open;
        else if (open) --open;
        else ++added;
    }
    return added + open;
}
'''
java = '''
public int minAdditions(String s) {
    int open = 0, added = 0;
    for (char c : s.toCharArray()) {
        if (c == '(') open++;
        else if (open > 0) open--;
        else added++;
    }
    return added + open;
}
'''

[[variants]]
title = "Nesting depth"
signature = "max_depth(s: str) -> int"
statement = """
s is a valid string of brackets ()[]{}, possibly with other characters. Return
its maximum nesting depth: "a(b[c]{d})" is 2, "" is 0.
"""
hint = "No stack needed: the depth goes up on an opening bracket and down on a closing one."
tests = [
  { in = ["a(b[c]{d})"], out = 2 },
  { in = [""], out = 0 },
  { in = ["()()"], out = 1 },
  { in = ["{[()]}"], out = 3 },
  { in = ["x"], out = 0 },
  { in = ["(()(()))"], out = 3 },
]
[variants.solutions]
python = '''
def max_depth(s):
    depth = best = 0
    for c in s:
        if c in "([{":
            depth += 1
            best = max(best, depth)
        elif c in ")]}":
            depth -= 1
    return best
'''
cpp = '''
int maxDepth(const string& s) {
    int depth = 0, best = 0;
    for (char c : s) {
        if (c == '(' || c == '[' || c == '{') best = max(best, ++depth);
        else if (c == ')' || c == ']' || c == '}') --depth;
    }
    return best;
}
'''
java = '''
public int maxDepth(String s) {
    int depth = 0, best = 0;
    for (char c : s.toCharArray()) {
        if ("([{".indexOf(c) >= 0) best = Math.max(best, ++depth);
        else if (")]}".indexOf(c) >= 0) depth--;
    }
    return best;
}
'''
