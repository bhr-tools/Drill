title = "Most common word"
tags = ["hashmap", "string"]
target = 120
signature = "most_common_word(text: str) -> str"
statement = """
Words are maximal runs of letters a-z, compared case-insensitively. Return the
most frequent word in lowercase; on a tie, the alphabetically smallest one.
"""
hint = "Lowercase, split on non-letters, count, then pick by (-count, word)."
tests = [
  { in = ["Bob hit a ball, the hit BALL flew far after it was hit."], out = "hit" },
  { in = ["a b B a"], out = "a" },
  { in = ["Hello"], out = "hello" },
  { in = ["x y z z y"], out = "y" },
  { in = ["it's it's"], out = "it" },
]

[solutions]
python = '''
import re
from collections import Counter

def most_common_word(text: str) -> str:
    counts = Counter(re.findall(r"[a-z]+", text.lower()))
    return min(counts, key=lambda w: (-counts[w], w))
'''
cpp = '''
string mostCommonWord(const string& text) {
    map<string, int> counts;
    string word;
    for (char c : text + " ") {
        if (isalpha((unsigned char)c)) word += tolower((unsigned char)c);
        else if (!word.empty()) {
            ++counts[word];
            word.clear();
        }
    }
    string best;
    int most = 0;
    for (auto& [w, n] : counts)
        if (n > most) best = w, most = n;
    return best;
}
'''
java = '''
public String mostCommonWord(String text) {
    Map<String, Integer> counts = new TreeMap<>();
    for (String w : text.toLowerCase().split("[^a-z]+"))
        if (!w.isEmpty()) counts.merge(w, 1, Integer::sum);
    String best = "";
    int most = 0;
    for (var e : counts.entrySet())
        if (e.getValue() > most) {
            best = e.getKey();
            most = e.getValue();
        }
    return best;
}
'''
