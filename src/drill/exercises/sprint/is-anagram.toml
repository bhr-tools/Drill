title = "Valid anagram"
tags = ["hashmap", "string"]
target = 60
signature = "is_anagram(a: str, b: str) -> bool"
statement = """
Is b a rearrangement of exactly the same characters as a?
"""
hint = "Compare character counts (or the sorted strings)."
tests = [
  { in = ["anagram", "nagaram"], out = true },
  { in = ["rat", "car"], out = false },
  { in = ["", ""], out = true },
  { in = ["a", "ab"], out = false },
  { in = ["listen", "silent"], out = true },
  { in = ["aab", "abb"], out = false },
]

[solutions]
python = '''
from collections import Counter

def is_anagram(a: str, b: str) -> bool:
    return Counter(a) == Counter(b)
'''
cpp = '''
bool isAnagram(const string& a, const string& b) {
    if (a.size() != b.size()) return false;
    array<int, 256> count{};
    for (unsigned char c : a) ++count[c];
    for (unsigned char c : b)
        if (--count[c] < 0) return false;
    return true;
}
'''
java = '''
public boolean isAnagram(String a, String b) {
    char[] x = a.toCharArray(), y = b.toCharArray();
    Arrays.sort(x);
    Arrays.sort(y);
    return Arrays.equals(x, y);
}
'''


[[variants]]
title = "Permutation of a palindrome"
signature = "palindrome_permutation(s: str) -> bool"
statement = """
s contains lowercase letters only. Can its letters be rearranged into a
palindrome?
"""
hint = "Count the letters: at most one may appear an odd number of times."
tests = [
  { in = ["carrace"], out = true },
  { in = ["drill"], out = false },
  { in = [""], out = true },
  { in = ["aabb"], out = true },
  { in = ["abc"], out = false },
  { in = ["z"], out = true },
]
[variants.solutions]
python = '''
from collections import Counter

def palindrome_permutation(s):
    return sum(n % 2 for n in Counter(s).values()) <= 1
'''
cpp = '''
bool palindromePermutation(const string& s) {
    array<int, 26> count{};
    for (char c : s) ++count[c - 'a'];
    return count_if(count.begin(), count.end(), [](int n) { return n % 2; }) <= 1;
}
'''
java = '''
public boolean palindromePermutation(String s) {
    int[] count = new int[26];
    for (char c : s.toCharArray()) count[c - 'a']++;
    return Arrays.stream(count).filter(n -> n % 2 == 1).count() <= 1;
}
'''

[[variants]]
title = "First repeated character"
signature = "first_repeat(s: str) -> str"
statement = """
Return the first character of s to appear for the second time, scanning left to
right, as a one-character string, or "" if no character repeats.
"""
hint = "A set of the characters seen so far."
tests = [
  { in = ["abcbad"], out = "b" },
  { in = ["abc"], out = "" },
  { in = [""], out = "" },
  { in = ["aa"], out = "a" },
  { in = ["xyzzyx"], out = "z" },
]
[variants.solutions]
python = '''
def first_repeat(s):
    seen = set()
    for c in s:
        if c in seen:
            return c
        seen.add(c)
    return ""
'''
cpp = '''
string firstRepeat(const string& s) {
    unordered_set<char> seen;
    for (char c : s)
        if (!seen.insert(c).second) return string(1, c);
    return "";
}
'''
java = '''
public String firstRepeat(String s) {
    Set<Character> seen = new HashSet<>();
    for (char c : s.toCharArray())
        if (!seen.add(c)) return String.valueOf(c);
    return "";
}
'''
