target = 90
statement = """
top_words(text, n) returns the n most frequent words as (word, count) tuples,
most frequent first; equally frequent words keep their order of first
appearance. Words are runs of lowercase letters and apostrophes, after
lowercasing the text.
"""
hint = "collections.Counter(re.findall(...)).most_common(n): Counter remembers insertion order."

[starter]
python = '''
