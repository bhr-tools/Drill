title = "List pipelines"
tags = ["ocaml", "idiom", "lists", "fold"]
target = 75
signature = "sum_odd_squares(xs: list[int]) -> int"
statement = """
The sum of the squares of the odd numbers of xs.
Write it as a pipeline: xs |> List.filter … |> List.map … |> List.fold_left …
"""
hint = "x mod 2 <> 0 is true for negative odd numbers too (x mod 2 is then -1)."
tests = [
  { in = [[1, 2, 3, 4, 5]], out = 35 },
  { in = [[]], out = 0 },
  { in = [[2, 4, 6]], out = 0 },
  { in = [[-3, -2, 7]], out = 58 },
  { in = [[1]], out = 1 },
]

[solutions]
ocaml = '''
let sum_odd_squares xs =
  xs
  |> List.filter (fun x -> x mod 2 <> 0)
  |> List.map (fun x -> x * x)
  |> List.fold_left ( + ) 0
'''

[[variants]]
signature = "count_long_words(words: list[str], n: int) -> int"
statement = """
How many words have strictly more than n characters, once their surrounding
blanks are trimmed? Use List.filter and List.length, or a single fold_left.
"""
hint = "String.trim, String.length, List.length (List.filter …)."
tests = [
  { in = [["ocaml", " ml ", "functional"], 3], out = 2 },
  { in = [[], 0], out = 0 },
  { in = [["  a  ", "bb"], 1], out = 1 },
  { in = [["abc", "abcd"], 3], out = 1 },
  { in = [["x"], 0], out = 1 },
]
[variants.solutions]
ocaml = '''
let count_long_words words n =
  List.fold_left (fun count w -> if String.length (String.trim w) > n then count + 1 else count) 0 words
'''

[[variants]]
signature = "running_max(xs: list[int]) -> list[int]"
statement = """
The running maximum: element i is the largest of xs[0..i].
Use List.fold_left with an accumulator, then List.rev, or List.fold_left_map.
"""
hint = "Accumulate (best so far, reversed result) and reverse at the end."
tests = [
  { in = [[1, 3, 2, 5, 4]], out = [1, 3, 3, 5, 5] },
  { in = [[]], out = [] },
  { in = [[-5, -7, -1]], out = [-5, -5, -1] },
  { in = [[2, 2]], out = [2, 2] },
  { in = [[9, 1]], out = [9, 9] },
]
[variants.solutions]
ocaml = '''
let running_max xs =
  match xs with
  | [] -> []
  | x :: _ ->
      let _, result = List.fold_left_map (fun best y -> let m = max best y in (m, m)) x xs in
      result
'''
