title = "Options instead of exceptions"
kind = "code"
tags = ["ocaml", "idiom", "option"]
target = 150
statement = """
Three functions that return an option rather than raise:
- safe_div a b: Some (a / b), or None when b = 0.
- parse_age s: the integer in s (blanks trimmed) when it is between 0 and 150, else None.
- first_adult people: the name of the first (name, age text) pair whose age parses
  and is at least 18.
Use int_of_string_opt, Option.bind or a match, and List.find_map.
"""
hint = "List.find_map (fun (name, age) -> match parse_age age with Some a when a >= 18 -> Some name | _ -> None)"

[starter]
ocaml = '''
let safe_div (a : int) (b : int) : int option = failwith "todo"

let parse_age (s : string) : int option = failwith "todo"

let first_adult (people : (string * string) list) : string option = failwith "todo"
'''

[checks]
ocaml = '''
let show = Show.(option int) in
check_eq ~show "safe_div 7 2" (safe_div 7 2) (Some 3);
check_eq ~show "safe_div by zero" (safe_div 1 0) None;
check_eq ~show "parse_age \" 42 \"" (parse_age " 42 ") (Some 42);
check_eq ~show "parse_age \"abc\"" (parse_age "abc") None;
check_eq ~show "parse_age \"151\"" (parse_age "151") None;
check_eq ~show "parse_age \"-1\"" (parse_age "-1") None;
check_eq ~show "parse_age \"0\"" (parse_age "0") (Some 0);
let show = Show.(option string) in
check_eq ~show "first adult" (first_adult [ ("Ann", "12"); ("Bob", "x"); ("Cy", "30"); ("Di", "40") ]) (Some "Cy");
check_eq ~show "nobody" (first_adult [ ("Ann", "12") ]) None;
check_eq ~show "empty" (first_adult []) None;
'''

[solutions]
ocaml = '''
let safe_div a b = if b = 0 then None else Some (a / b)

let parse_age s =
  match int_of_string_opt (String.trim s) with
  | Some age when age >= 0 && age <= 150 -> Some age
  | _ -> None

let first_adult people =
  List.find_map
    (fun (name, age) -> match parse_age age with Some a when a >= 18 -> Some name | _ -> None)
    people
'''
