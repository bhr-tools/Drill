title = "Valid palindrome"
tags = ["string", "two-pointers"]
target = 75
signature = "is_palindrome(s: str) -> bool"
statement = """
Considering only letters and digits, and ignoring case, does s read the same
forwards and backwards?
"""
hint = "Two indices moving towards each other, skipping non-alphanumeric characters."
complexity = "O(n)"
tests = [
  { in = ["A man, a plan, a canal: Panama"], out = true },
  { in = ["race a car"], out = false },
  { in = [" "], out = true },
  { in = ["0P"], out = false },
  { in = ["ab_a"], out = true },
  { in = ["Madam"], out = true },
]

[solutions]
python = '''
def is_palindrome(s: str) -> bool:
    chars = [c.lower() for c in s if c.isalnum()]
    return chars == chars[::-1]
'''
cpp = '''
bool isPalindrome(const string& s) {
    int i = 0, j = (int)s.size() - 1;
    while (i < j) {
        if (!isalnum((unsigned char)s[i])) ++i;
        else if (!isalnum((unsigned char)s[j])) --j;
        else if (tolower((unsigned char)s[i++]) != tolower((unsigned char)s[j--])) return false;
    }
    return true;
}
'''
java = '''
public boolean isPalindrome(String s) {
    int i = 0, j = s.length() - 1;
    while (i < j) {
        char a = s.charAt(i), b = s.charAt(j);
        if (!Character.isLetterOrDigit(a)) i++;
        else if (!Character.isLetterOrDigit(b)) j--;
        else if (Character.toLowerCase(a) != Character.toLowerCase(b)) return false;
        else { i++; j--; }
    }
    return true;
}
'''

[scale]
label = "n = len(s)"
code = '''
half = "".join(rng.choice("abcdefghij") for _ in range(n // 2))
args = [half + half[::-1]]
'''
