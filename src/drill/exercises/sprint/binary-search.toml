title = "Last occurrence"
signature = "last_occurrence(nums: list[int], target: int) -> int"
statement = """
nums is sorted in ascending order and may have duplicates. Return the index of
the last occurrence of target, or -1 if it is absent, in O(log n). Write the
search by hand.
"""
hint = "Keep searching right of a match: remember mid, then lo = mid + 1."
tests = [
  { in = [[1, 2, 2, 2, 5], 2], out = 3 },
  { in = [[1, 2, 2, 2, 5], 3], out = -1 },
  { in = [[1, 2, 2, 2, 5], 5], out = 4 },
  { in = [[], 1], out = -1 },
  { in = [[7, 7, 7], 7], out = 2 },
  { in = [[4], 4], out = 0 },
]
[variants.solutions]
python = '''
def last_occurrence(nums, target):
    lo, hi, found = 0, len(nums) - 1, -1
    while lo <= hi:
        mid = (lo + hi) // 2
        if nums[mid] <= target:
            if nums[mid] == target:
                found = mid
            lo = mid + 1
        else:
            hi = mid - 1
    return found
'''
cpp = '''
int lastOccurrence(vector<int>& nums, int target) {
    int lo = 0, hi = (int)nums.size() - 1, found = -1;
    while (lo <= hi) {
        int mid = lo + (hi - lo) / 2;
        if (nums[mid] <= target) {
            if (nums[mid] == target) found = mid;
            lo = mid + 1;
        } else {
            hi = mid - 1;
        }
    }
    return found;
}
'''
java = '''
public int lastOccurrence(int[] nums, int target) {
    int lo = 0, hi = nums.length - 1, found = -1;
    while (lo <= hi) {
        int mid = (lo + hi) >>> 1;
        if (nums[mid] <= target) {
            if (nums[mid] == target) found = mid;
            lo = mid + 1;
        } else {
            hi = mid - 1;
        }
    }
    return found;
}
'''
