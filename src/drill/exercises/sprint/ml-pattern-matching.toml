title = "Pattern matching on lists"
tags = ["ocaml", "idiom", "pattern-matching", "recursion"]
target = 90
signature = "dedup_adjacent(xs: list[int]) -> list[int]"
statement = """
Remove the consecutive duplicates: [1; 1; 2; 1; 1] gives [1; 2; 1].
Match on two heads at once, with `as` and a `when` guard.
"""
hint = "| a :: (b :: _ as rest) when a = b -> dedup_adjacent rest"
tests = [
  { in = [[1, 1, 2, 1, 1]], out = [1, 2, 1] },
  { in = [[]], out = [] },
  { in = [[7]], out = [7] },
  { in = [[3, 3, 3]], out = [3] },
  { in = [[1, 2, 3]], out = [1, 2, 3] },
]

[solutions]
ocaml = '''
let rec dedup_adjacent = function
  | a :: (b :: _ as rest) when a = b -> dedup_adjacent rest
  | a :: rest -> a :: dedup_adjacent rest
  | [] -> []
'''

[[variants]]
signature = "pairwise_sums(xs: list[int]) -> list[int]"
statement = """
The sums of neighbours: [1; 2; 4] gives [3; 6]. A list of fewer than two
numbers gives []. Match two heads at once with `as`.
"""
hint = "| a :: (b :: _ as rest) -> (a + b) :: pairwise_sums rest"
tests = [
  { in = [[1, 2, 4]], out = [3, 6] },
  { in = [[]], out = [] },
  { in = [[5]], out = [] },
  { in = [[-1, 1, -1]], out = [0, 0] },
  { in = [[10, 20]], out = [30] },
]
[variants.solutions]
ocaml = '''
let rec pairwise_sums = function
  | a :: (b :: _ as rest) -> (a + b) :: pairwise_sums rest
  | _ -> []
'''

[[variants]]
signature = "is_sorted(xs: list[int]) -> bool"
statement = """
Whether xs is in non-decreasing order. Match two heads at once; the empty list
and single elements are sorted.
"""
hint = "| a :: (b :: _ as rest) -> a <= b && is_sorted rest"
tests = [
  { in = [[1, 2, 2, 5]], out = true },
  { in = [[]], out = true },
  { in = [[4]], out = true },
  { in = [[1, 3, 2]], out = false },
  { in = [[5, 4]], out = false },
]
[variants.solutions]
ocaml = '''
let rec is_sorted = function
  | a :: (b :: _ as rest) -> a <= b && is_sorted rest
  | _ -> true
'''
