title = "Attribute sets with lib"
tags = ["nix", "idiom", "attrsets", "lib"]
target = 90
signature = "enabled_services(services: any) -> list[str]"
statement = """
The names of the services whose `enable` is true, sorted. A service may have no
`enable` attribute at all: it is then disabled.
This is how NixOS modules look for what to turn on.
"""
hint = "lib.attrNames (lib.filterAttrs (name: svc: svc.enable or false) services): attrNames is already sorted."
explanation = """
`svc.enable or false` is Nix's default for a missing attribute: no `?` test
needed. builtins.attrNames always returns the names sorted, as attribute sets are
ordered by name.
"""
tests = [
  { in = [{ nginx = { enable = true }, ssh = { enable = false }, cups = { enable = true, port = 631 } }], out = ["cups", "nginx"] },
  { in = [{}], out = [] },
  { in = [{ a = {} }], out = [] },
  { in = [{ z = { enable = true }, b = { enable = true } }], out = ["b", "z"] },
  { in = [{ only = { enable = false } }], out = [] },
]

[solutions]
nix = '''
services: lib.attrNames (lib.filterAttrs (name: svc: svc.enable or false) services)
'''

[[variants]]
signature = "with_defaults(defaults: any, overrides: any) -> any"
statement = """
Merge overrides into defaults, recursively: nested attribute sets are merged
key by key, anything else (lists included) is replaced by the override.
"""
hint = "lib.recursiveUpdate, where // would replace nested sets whole."
explanation = """
`a // b` is shallow: a nested set of b replaces the one of a entirely.
lib.recursiveUpdate descends into sets present on both sides, which is the
behaviour of NixOS option merging for attribute sets (lists, though, are
concatenated by the module system, and replaced here).
"""
tests = [
  { in = [{ port = 80, tls = { enable = false, version = "1.2" } }, { tls = { enable = true } }], out = { port = 80, tls = { enable = true, version = "1.2" } } },
  { in = [{}, { a = 1 }], out = { a = 1 } },
  { in = [{ a = 1 }, {}], out = { a = 1 } },
  { in = [{ l = [1, 2] }, { l = [3] }], out = { l = [3] } },
  { in = [{ a = { b = { c = 1, d = 2 } } }, { a = { b = { d = 3 } } }], out = { a = { b = { c = 1, d = 3 } } } },
]
[variants.solutions]
nix = '''
defaults: overrides: lib.recursiveUpdate defaults overrides
'''

[[variants]]
signature = "prefix_names(prefix: str, attrs: any) -> any"
statement = """
Rename every attribute by putting prefix in front of its name:
prefix_names "drill-" { a = 1; } gives { drill-a = 1; }.
"""
hint = "lib.mapAttrs' (name: value: lib.nameValuePair \"${prefix}${name}\" value)"
tests = [
  { in = ["drill-", { a = 1, b = 2 }], out = { drill-a = 1, drill-b = 2 } },
  { in = ["x", {}], out = {} },
  { in = ["", { k = "v" }], out = { k = "v" } },
  { in = ["my", { Var = [1] }], out = { myVar = [1] } },
  { in = ["p_", { nested = { a = 1 } }], out = { p_nested = { a = 1 } } },
]
[variants.solutions]
nix = '''
prefix: attrs: lib.mapAttrs' (name: value: lib.nameValuePair "${prefix}${name}" value) attrs
'''
