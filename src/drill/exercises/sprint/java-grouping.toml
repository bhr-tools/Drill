title = "Grouping collectors"
kind = "code"
tags = ["java", "idiom", "streams", "collectors"]
target = 120
statement = """
In class Grouping:
- byLength(words): words grouped by length, keys in ascending order, each group
  in input order;
- firstLetterCounts(words): how many words start with each letter.
"""
hint = "Collectors.groupingBy(classifier, TreeMap::new, Collectors.toList()), and Collectors.counting()."

[starter]
java = '''
import java.util.*;
import java.util.stream.*;

class Grouping {
    static Map<Integer, List<String>> byLength(List<String> words) {
    }

    static Map<Character, Long> firstLetterCounts(List<String> words) {
    }
}
'''

[checks]
java = '''
Map<Integer, List<String>> groups = Grouping.byLength(List.of("ox", "cat", "be", "dog", "a"));
check("groups", groups, Map.of(1, List.of("a"), 2, List.of("ox", "be"), 3, List.of("cat", "dog")));
check("keys in ascending order", new ArrayList<>(groups.keySet()), List.of(1, 2, 3));
check("counts", Grouping.firstLetterCounts(List.of("apple", "avocado", "banana")), Map.of('a', 2L, 'b', 1L));
check("empty", Grouping.byLength(List.of()), Map.of());
'''

[solutions]
java = '''
import java.util.*;
import java.util.stream.*;

class Grouping {
    static Map<Integer, List<String>> byLength(List<String> words) {
        return words.stream().collect(Collectors.groupingBy(String::length, TreeMap::new, Collectors.toList()));
    }

    static Map<Character, Long> firstLetterCounts(List<String> words) {
        return words.stream().collect(Collectors.groupingBy(w -> w.charAt(0), Collectors.counting()));
    }
}
'''
