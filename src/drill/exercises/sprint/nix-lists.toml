title = "Lists into attribute sets"
tags = ["nix", "idiom", "lists", "lib"]
target = 90
signature = "home_dirs(names: list[str]) -> any"
statement = """
An attribute set with one entry per user, as in users.users:
home_dirs [ "ada" ] gives { ada = { home = "/home/ada"; isNormalUser = true; }; }.
"""
hint = "lib.genAttrs names (name: { … }), or builtins.listToAttrs (map … names)."
tests = [
  { in = [["ada", "bob"]], out = { ada = { home = "/home/ada", isNormalUser = true }, bob = { home = "/home/bob", isNormalUser = true } } },
  { in = [[]], out = {} },
  { in = [["x"]], out = { x = { home = "/home/x", isNormalUser = true } } },
  { in = [["a", "a"]], out = { a = { home = "/home/a", isNormalUser = true } } },
  { in = [["z", "m"]], out = { m = { home = "/home/m", isNormalUser = true }, z = { home = "/home/z", isNormalUser = true } } },
]

[solutions]
nix = '''
names: lib.genAttrs names (name: { home = "/home/${name}"; isNormalUser = true; })
'''

[[variants]]
signature = "count_by_extension(files: list[str]) -> any"
statement = """
Count the files by extension (what follows the last dot):
[ "a.nix" "b.nix" "c.md" ] gives { md = 1; nix = 2; }. Every name has a dot.
"""
hint = "lib.groupBy (f: lib.last (lib.splitString \".\" f)), then lib.mapAttrs (_: builtins.length)."
tests = [
  { in = [["a.nix", "b.nix", "c.md"]], out = { md = 1, nix = 2 } },
  { in = [[]], out = {} },
  { in = [["archive.tar.gz"]], out = { gz = 1 } },
  { in = [["x.c", "y.c", "z.c"]], out = { c = 3 } },
  { in = [[".bashrc", "f.txt"]], out = { bashrc = 1, txt = 1 } },
]
[variants.solutions]
nix = '''
files: lib.mapAttrs (_: builtins.length) (lib.groupBy (f: lib.last (lib.splitString "." f)) files)
'''

[[variants]]
signature = "unique_sorted(xs: list[int]) -> list[int]"
statement = """
The distinct values of xs, in increasing order.
"""
hint = "lib.unique, then builtins.sort builtins.lessThan (sort takes the comparison first)."
tests = [
  { in = [[3, 1, 3, 2, 1]], out = [1, 2, 3] },
  { in = [[]], out = [] },
  { in = [[5]], out = [5] },
  { in = [[-1, -1, -2]], out = [-2, -1] },
  { in = [[9, 8, 7]], out = [7, 8, 9] },
]
[variants.solutions]
nix = '''
xs: builtins.sort builtins.lessThan (lib.unique xs)
'''
