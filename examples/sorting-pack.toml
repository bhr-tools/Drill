[pack]
name = "Sorting and searching"
description = "Example pack: elementary sorts, binary search and its variants, merge sort and heaps, as an introductory algorithms course teaches them."

[[exercises]]
id = "insertion-sort"
mode = "sprint"
title = "Insertion sort"
tags = ["sorting", "insertion-sort"]
target = 120
signature = "insertion_sort(nums: list[int]) -> list[int]"
statement = """
Sort nums in ascending order with insertion sort, in place, and return it.
Do not call a library sort.
"""
hint = "For each i, shift the larger elements of nums[0..i-1] one slot right, then drop nums[i] in the gap."
tests = [
  { in = [[5, 2, 4, 6, 1, 3]], out = [1, 2, 3, 4, 5, 6] },
  { in = [[]], out = [] },
  { in = [[1]], out = [1] },
  { in = [[3, 3, 1]], out = [1, 3, 3] },
  { in = [[-1, -5, 0]], out = [-5, -1, 0] },
]

[exercises.solutions]
python = '''
def insertion_sort(nums):
    for i in range(1, len(nums)):
        x, j = nums[i], i - 1
        while j >= 0 and nums[j] > x:
            nums[j + 1] = nums[j]
            j -= 1
        nums[j + 1] = x
    return nums
'''
cpp = '''
vector<int> insertionSort(vector<int>& nums) {
    for (size_t i = 1; i < nums.size(); ++i) {
        int x = nums[i];
        size_t j = i;
        while (j > 0 && nums[j - 1] > x) {
            nums[j] = nums[j - 1];
            --j;
        }
        nums[j] = x;
    }
    return nums;
}
'''

[[exercises]]
id = "lower-bound"
mode = "sprint"
title = "Lower bound"
tags = ["binary-search"]
target = 120
signature = "lower_bound(nums: list[int], x: int) -> int"
statement = """
nums is sorted in ascending order. Return the first index i such that
nums[i] >= x, or len(nums) if there is none. Write the binary search yourself.
"""
hint = "Search the half-open range [lo, hi): if nums[mid] < x, lo = mid + 1, else hi = mid."
tests = [
  { in = [[1, 2, 4, 4, 7], 4], out = 2 },
  { in = [[1, 2, 4, 4, 7], 5], out = 4 },
  { in = [[1, 2, 4, 4, 7], 0], out = 0 },
  { in = [[1, 2, 4, 4, 7], 8], out = 5 },
  { in = [[], 3], out = 0 },
  { in = [[2, 2, 2], 2], out = 0 },
]

[exercises.solutions]
python = '''
def lower_bound(nums, x):
    lo, hi = 0, len(nums)
    while lo < hi:
        mid = (lo + hi) // 2
        if nums[mid] < x:
            lo = mid + 1
        else:
            hi = mid
    return lo
'''
cpp = '''
int lowerBound(vector<int>& nums, int x) {
    int lo = 0, hi = nums.size();
    while (lo < hi) {
        int mid = lo + (hi - lo) / 2;
        if (nums[mid] < x) lo = mid + 1;
        else hi = mid;
    }
    return lo;
}
'''

[[exercises]]
id = "count-inversions"
mode = "normal"
title = "Counting inversions"
tags = ["merge-sort", "divide-and-conquer"]
target = 600
signature = "count_inversions(nums: list[int]) -> long"
statement = """
An inversion is a pair i < j with nums[i] > nums[j]. Return the number of
inversions of nums, in O(n log n).
"""
hint = "Merge sort: when an element of the right half is placed before the rest of the left half, it forms an inversion with each of them."
explanation = """
Comparing every pair is O(n²). Merge sort counts them while it sorts: during the
merge of two sorted halves L and R, when R[j] is placed before L[i], it is smaller
than L[i] and than every element after it in L, so it forms len(L) - i inversions
at once. Inversions inside each half are counted by the recursive calls, and
those across the halves by the merge: the total is exact.

The recursion has log n levels, each merging n elements: O(n log n), the
complexity of merge sort itself. The count can reach n(n-1)/2, hence a 64-bit
result.
"""
complexity = "O(n log n)"
tests = [
  { in = [[2, 4, 1, 3, 5]], out = 3 },
  { in = [[]], out = 0 },
  { in = [[1, 2, 3]], out = 0 },
  { in = [[3, 2, 1]], out = 3 },
  { in = [[1, 1, 1]], out = 0 },
  { in = [[5, 4, 3, 2, 1]], out = 10 },
]

[exercises.solutions]
python = '''
def count_inversions(nums):
    def sort(a):
        if len(a) <= 1:
            return a, 0
        mid = len(a) // 2
        left, x = sort(a[:mid])
        right, y = sort(a[mid:])
        merged, count, i, j = [], x + y, 0, 0
        while i < len(left) and j < len(right):
            if left[i] <= right[j]:
                merged.append(left[i])
                i += 1
            else:
                merged.append(right[j])
                count += len(left) - i
                j += 1
        return merged + left[i:] + right[j:], count

    return sort(nums)[1]
'''
cpp = '''
long long sortCount(vector<int>& a, vector<int>& tmp, int lo, int hi) {
    if (hi - lo <= 1) return 0;
    int mid = (lo + hi) / 2;
    long long count = sortCount(a, tmp, lo, mid) + sortCount(a, tmp, mid, hi);
    int i = lo, j = mid, k = lo;
    while (i < mid && j < hi) {
        if (a[i] <= a[j]) tmp[k++] = a[i++];
        else {
            count += mid - i;
            tmp[k++] = a[j++];
        }
    }
    while (i < mid) tmp[k++] = a[i++];
    while (j < hi) tmp[k++] = a[j++];
    copy(tmp.begin() + lo, tmp.begin() + hi, a.begin() + lo);
    return count;
}

long long countInversions(vector<int>& nums) {
    vector<int> tmp(nums.size());
    return sortCount(nums, tmp, 0, nums.size());
}
'''

