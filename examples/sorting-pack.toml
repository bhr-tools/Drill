[[exercises]]
id = "kth-smallest"
mode = "normal"
title = "k-th smallest with a heap"
tags = ["heaps", "selection"]
target = 420
signature = "kth_smallest(nums: list[int], k: int) -> int"
statement = """
Return the k-th smallest element of nums (k = 1 is the minimum), in O(n log k):
keep only k candidates at any time.
"""
hint = "A max-heap of the k smallest seen so far: a new element smaller than its top replaces it."
explanation = """
Sorting gives the answer in O(n log n) but orders far more than needed. A
max-heap of size k holds the k smallest elements seen so far, its top being the
largest of them: a new element smaller than the top replaces it. Each step is
O(log k), so O(n log k), which is O(n) when k is a constant. Python's heapq is a
min-heap: store negated values.
"""
tests = [
  { in = [[7, 10, 4, 3, 20, 15], 3], out = 7 },
  { in = [[1], 1], out = 1 },
  { in = [[5, 5, 5], 2], out = 5 },
  { in = [[-3, 2, -1], 1], out = -3 },
  { in = [[9, 8, 7, 6], 4], out = 9 },
]

[exercises.solutions]
python = '''
import heapq


def kth_smallest(nums, k):
    heap = []  # negated: a max-heap of the k smallest
    for x in nums:
        if len(heap) < k:
            heapq.heappush(heap, -x)
        elif x < -heap[0]:
            heapq.heapreplace(heap, -x)
    return -heap[0]
'''
cpp = '''
int kthSmallest(vector<int>& nums, int k) {
    priority_queue<int> heap;  // max-heap of the k smallest
    for (int x : nums) {
        if ((int)heap.size() < k) heap.push(x);
        else if (x < heap.top()) {
            heap.pop();
            heap.push(x);
        }
    }
    return heap.top();
}
'''

[[exercises]]
id = "min-heap"
mode = "hard"
kind = "code"
title = "A binary min-heap"
tags = ["heaps", "data-structures"]
target = 1200
statement = """
Implement a binary min-heap of ints stored in an array:
push(x), pop() (removes and returns the minimum), top(), size(), and a
constructor from a list that heapifies it in O(n).
pop() and top() on an empty heap raise IndexError (Python) / std::out_of_range (C++).
"""
hint = "Children of i are 2i+1 and 2i+2; sift up after push, sift down after pop; heapify by sifting down from the last parent to 0."
explanation = """
The array is a complete binary tree read level by level, so no pointers are
needed: the parent of i is (i - 1) / 2. push adds at the end and sifts up, pop
moves the last element to the root and sifts down, both along one path: O(log n).

Building by n pushes costs O(n log n), but sifting down from the last parent to
the root is O(n): most nodes are near the bottom, where sifting is cheap, and the
sum of the heights over all nodes is below n.
"""

[exercises.starter]
python = '''
class MinHeap:
    def __init__(self, items=()):
        pass

    def push(self, x: int) -> None:
        pass

    def pop(self) -> int:
        pass

    def top(self) -> int:
        pass

    def __len__(self) -> int:
        pass
'''
cpp = '''
#include <bits/stdc++.h>

class MinHeap {
public:
    explicit MinHeap(std::vector<int> items = {}) {}
    void push(int x) {}
    int pop() {}
    int top() const {}
    std::size_t size() const {}
};
'''

[exercises.checks]
python = '''
import random

h = MinHeap()
for x in [5, 3, 8, 1]:
    h.push(x)
check("top", h.top(), 1)
check("size", len(h), 4)
check("pops in order", [h.pop() for _ in range(4)], [1, 3, 5, 8])
raises("pop on empty", IndexError, h.pop)
raises("top on empty", IndexError, h.top)
data = [random.randint(-1000, 1000) for _ in range(2000)]
built = MinHeap(data)
check("heapify then pop", [built.pop() for _ in range(2000)], sorted(data))
check("duplicates", [MinHeap([2, 2, 1]).pop()], [1])
'''
cpp = '''
MinHeap h;
for (int x : {5, 3, 8, 1}) h.push(x);
CHECK_EQ(h.top(), 1);
CHECK_EQ(h.size(), std::size_t{4});
std::vector<int> popped;
for (int i = 0; i < 4; ++i) popped.push_back(h.pop());
CHECK_EQ(popped, std::vector<int>{1, 3, 5, 8});
CHECK_THROWS(std::out_of_range, h.pop());
CHECK_THROWS(std::out_of_range, h.top());
std::vector<int> data;
for (int i = 0; i < 2000; ++i) data.push_back((i * 7919) % 2001 - 1000);
MinHeap built(data);
std::vector<int> out;
while (built.size()) out.push_back(built.pop());
std::ranges::sort(data);
CHECK_EQ(out, data);
'''

[exercises.solutions]
python = '''
class MinHeap:
    def __init__(self, items=()):
        self.a = list(items)
        for i in reversed(range(len(self.a) // 2)):
            self._down(i)

    def _up(self, i):
        a = self.a
        while i and a[(i - 1) // 2] > a[i]:
            a[i], a[(i - 1) // 2] = a[(i - 1) // 2], a[i]
            i = (i - 1) // 2

    def _down(self, i):
        a, n = self.a, len(self.a)
        while True:
            smallest = i
            for c in (2 * i + 1, 2 * i + 2):
                if c < n and a[c] < a[smallest]:
                    smallest = c
            if smallest == i:
                return
            a[i], a[smallest] = a[smallest], a[i]
            i = smallest

    def push(self, x):
        self.a.append(x)
        self._up(len(self.a) - 1)

    def pop(self):
        if not self.a:
            raise IndexError("pop from an empty heap")
        a = self.a
        a[0], a[-1] = a[-1], a[0]
        x = a.pop()
        if a:
            self._down(0)
        return x

    def top(self):
        if not self.a:
            raise IndexError("top of an empty heap")
        return self.a[0]

    def __len__(self):
        return len(self.a)
'''
cpp = '''
#include <bits/stdc++.h>

class MinHeap {
public:
    explicit MinHeap(std::vector<int> items = {}) : a_(std::move(items)) {
        for (std::size_t i = a_.size() / 2; i-- > 0;) down(i);
    }

    void push(int x) {
        a_.push_back(x);
        for (std::size_t i = a_.size() - 1; i && a_[(i - 1) / 2] > a_[i]; i = (i - 1) / 2)
            std::swap(a_[i], a_[(i - 1) / 2]);
    }

    int pop() {
        int x = top();
        a_.front() = a_.back();
        a_.pop_back();
        if (!a_.empty()) down(0);
        return x;
    }

    int top() const {
        if (a_.empty()) throw std::out_of_range("empty heap");
        return a_.front();
    }

    std::size_t size() const { return a_.size(); }

private:
    void down(std::size_t i) {
        while (true) {
            std::size_t smallest = i;
            for (std::size_t c : {2 * i + 1, 2 * i + 2})
                if (c < a_.size() && a_[c] < a_[smallest]) smallest = c;
            if (smallest == i) return;
            std::swap(a_[i], a_[smallest]);
            i = smallest;
        }
    }

    std::vector<int> a_;
};
'''

[[exercises]]
id = "dedupe-sorted"
mode = "optim"
title = "Distinct values"
tags = ["sorting", "hashing"]
target = 300
signature = "count_distinct(nums: list[int]) -> int"
complexity = "O(n log n)"
statement = """
count_distinct(nums) is the number of distinct values in nums.
The code you start with is correct, but too slow for the performance test.
1. Estimate its complexity, then press c to measure it.
2. Make it fast enough, and measure again.
"""
hint = "After sorting, equal values are next to each other."
explanation = """
The starting code compares each element with all the previous ones: O(n²).
Sorting first puts equal values side by side, so one pass counting the changes
between neighbours is enough: O(n log n) for the sort, then O(n). A hash set does
it in O(n) on average; sorting needs no extra memory if done in place.
"""
tests = [
  { in = [[1, 2, 2, 3]], out = 3 },
  { in = [[]], out = 0 },
  { in = [[7, 7, 7]], out = 1 },
  { in = [[-1, 1, -1, 1]], out = 2 },
  { in = [[5, 4, 3]], out = 3 },
]

[exercises.starter]
python = '''
def count_distinct(nums: list[int]) -> int:
    count = 0
    for i, x in enumerate(nums):
        if x not in nums[:i]:
            count += 1
    return count
'''
cpp = '''
#include <bits/stdc++.h>
using namespace std;

int countDistinct(vector<int>& nums) {
    int count = 0;
    for (size_t i = 0; i < nums.size(); ++i)
        if (find(nums.begin(), nums.begin() + i, nums[i]) == nums.begin() + i) ++count;
    return count;
}
'''

[exercises.solutions]
python = '''
def count_distinct(nums):
    a = sorted(nums)
    return sum(1 for i, x in enumerate(a) if i == 0 or x != a[i - 1])
'''
cpp = '''
int countDistinct(vector<int>& nums) {
    sort(nums.begin(), nums.end());
    return unique(nums.begin(), nums.end()) - nums.begin();
}
'''

